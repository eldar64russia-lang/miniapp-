<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Конструктор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f5f7;--bg-2:#fff;--bg-3:#ececf0;--text:#1d1d1f;--text-dim:#86868b;
--text-muted:#c7c7cc;--border:#e0e0e5;--accent:#007aff;--accent-soft:rgba(0,122,255,.12);
--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08);
--shadow-lg:0 10px 30px rgba(0,0,0,.12);
--radius-sm:16px;--radius:26px;--radius-lg:30px;
--tap:44px;--gap:10px;
--dock-bg:rgba(255,255,255,.72);--dock-border:rgba(0,0,0,.06);
--card-bg:rgba(255,255,255,.82)}
[data-theme=dark]{--bg:#1c1c1e;--bg-2:#2c2c2e;--bg-3:#3a3a3c;--text:#f5f5f7;--text-dim:#98989d;
--text-muted:#48484a;--border:#38383a;--accent:#0a84ff;--accent-soft:rgba(10,132,255,.18);
--shadow-sm:0 1px 3px rgba(0,0,0,.2);--shadow-md:0 4px 12px rgba(0,0,0,.3);
--shadow-lg:0 10px 30px rgba(0,0,0,.4);
--dock-bg:rgba(44,44,46,.72);--dock-border:rgba(255,255,255,.08);
--card-bg:rgba(44,44,46,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
font-size:15px;line-height:1.35;min-height:100vh;overscroll-behavior-y:contain;
transition:background .2s,color .2s}
.day-card,.task-row,.task-text,.icon-btn,.mini-btn,.dock-item,.swatch,.btn,.checkbox,
.cell-task-text,.day-name,.num-value,.cell-checkbox,.width-handle,.resize-handle{
-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
mark{background:rgba(255,214,10,.5);color:inherit;padding:0;border-radius:2px}
[data-theme=dark] mark{background:rgba(255,214,10,.35)}
.app{max-width:720px;margin:0 auto;padding:12px 16px calc(120px + env(safe-area-inset-bottom));
padding-top:calc(12px + env(safe-area-inset-top))}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;
margin-bottom:16px;min-height:44px}
.app-header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.5px;flex:1;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.header-actions{display:flex;gap:8px}
.icon-btn{min-width:var(--tap);min-height:var(--tap);border:none;background:var(--bg-3);
color:var(--text);border-radius:var(--radius-sm);font-size:18px;display:inline-flex;
align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s}
.icon-btn:active{background:var(--accent-soft);transform:scale(.94)}
.icon-btn.active{background:var(--accent-soft);color:var(--accent)}
.search-overlay{max-height:0;overflow:hidden;margin-bottom:0;transition:max-height .2s,margin-bottom .2s}
.search-overlay.open{max-height:60px;margin-bottom:12px}
.search-field{display:flex;align-items:center;gap:8px;background:var(--bg-2);
border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px;
min-height:var(--tap);box-shadow:var(--shadow-sm)}
.search-field input{flex:1;background:transparent;border:none;color:var(--text);
font-size:15px;outline:none;padding:10px 0;font-family:inherit}
.search-field input::-webkit-search-cancel-button{-webkit-appearance:none}
.close-search{background:transparent;border:none;color:var(--text-dim);font-size:16px;
cursor:pointer;padding:4px;min-width:32px;min-height:32px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{min-height:34px;padding:0 14px;border-radius:17px;border:none;
background:var(--bg-3);color:var(--text-dim);font-size:13px;font-weight:500;
white-space:nowrap;cursor:pointer;font-family:inherit}
.filters button.active{background:var(--accent);color:#fff}
.col-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;margin-bottom:12px;
border-bottom:1px solid var(--border);scrollbar-width:none}
.col-nav::-webkit-scrollbar{display:none}
.col-nav button{min-width:36px;height:36px;padding:0 10px;border-radius:10px;
border:1px solid var(--border);background:var(--bg-2);color:var(--text-dim);
font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;flex:none}
.col-nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.columns-container{display:grid;gap:var(--gap);overflow-x:auto;padding-bottom:12px;
align-items:start;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.day-card{background:var(--card-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:8px;
cursor:pointer;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
transition:box-shadow .15s;min-width:0;align-self:start}
.day-card::before{content:'';position:absolute;top:12px;left:0;bottom:12px;width:3px;
background:var(--card-color,var(--accent));border-radius:0 2px 2px 0}
.day-card:active{box-shadow:var(--shadow-md)}
.day-card.dragging{opacity:.45}
.day-card.drag-target{box-shadow:0 0 0 2px var(--accent)}
.day-card.is-today{box-shadow:0 0 0 1.5px var(--accent),var(--shadow-sm)}
.day-card.is-today::before{width:5px;background:var(--accent)}
body.edit-mode .day-card{outline:2px dashed var(--border);outline-offset:-2px;cursor:grab;touch-action:none}
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;padding-left:6px}
.day-name{font-weight:700;font-size:15px;letter-spacing:-.2px;flex:1;
word-break:break-word;min-width:0;padding:2px 0;line-height:1.25}
.day-name.empty-name{color:var(--text-muted);font-weight:500;font-style:italic}
.day-actions{display:flex;gap:0;flex:none}
.mini-btn{position:relative;width:26px;height:26px;border:none;background:transparent;
color:var(--text-dim);border-radius:8px;font-size:13px;display:inline-flex;
align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:inherit}
.mini-btn::before{content:'';position:absolute;inset:-9px}
.mini-btn:active{background:var(--accent-soft);color:var(--accent)}
.cell-tasks{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:14px;
overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.cell-task{display:flex;align-items:flex-start;gap:6px;padding:2px 0;
font-size:12px;line-height:1.3;min-width:0}
.cell-task-text{flex:1;min-width:0;cursor:text;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}
.cell-task-text.done{text-decoration:line-through;opacity:.55;color:var(--text-dim)}
.cell-checkbox{width:16px;height:16px;min-width:16px;border-radius:50%;
border:1.5px solid var(--text-muted);background:transparent;cursor:pointer;padding:0;
display:inline-flex;align-items:center;justify-content:center;position:relative;
color:var(--cb-color,var(--accent));margin-top:1px}
.cell-checkbox.checked{background:var(--cb-color,var(--accent));
border-color:var(--cb-color,var(--accent))}
.cell-checkbox svg{width:10px;height:10px;display:block}
.cell-checkbox::before{content:'';position:absolute;inset:-10px}
.cell-empty{font-size:11px;color:var(--text-dim);padding:4px 0;font-style:italic}
.resize-handle{display:none;position:absolute;right:0;bottom:0;width:26px;height:26px;
cursor:ns-resize;touch-action:none;z-index:3}
body.edit-mode .resize-handle{display:block}
.resize-handle::after{content:'';position:absolute;right:4px;bottom:4px;
width:12px;height:12px;border-right:2px solid var(--text-muted);
border-bottom:2px solid var(--text-muted);border-radius:0 0 4px 0;opacity:.7}
.width-handle{display:none;position:absolute;right:0;top:50%;
transform:translateY(-50%);width:24px;height:60px;cursor:ew-resize;
touch-action:none;z-index:3;align-items:center;justify-content:center}
body.edit-mode .width-handle{display:flex}
.width-handle::after{content:'';width:4px;height:26px;background:var(--text-muted);
border-radius:2px;opacity:.7;box-shadow:0 0 0 1px var(--card-bg)}
.empty{text-align:center;color:var(--text-dim);padding:40px 20px;font-size:14px;margin:0;
grid-column:1 / -1}
.dock{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;
transform:translateX(-50%);background:var(--dock-bg);
backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
border:1px solid var(--dock-border);border-radius:var(--radius-lg);
padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;
box-shadow:var(--shadow-lg);z-index:100}
.dock-scroll{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
flex:0 1 auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dock-scroll::-webkit-scrollbar{display:none}
.dock-item{width:56px;height:56px;border:none;background:transparent;border-radius:20px;
cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;
flex:0 0 56px;position:relative;padding:0}
.dock-item:active{transform:scale(.92)}
.dock-item.active{background:var(--accent-soft)}
.dock-item.active::after{content:'';position:absolute;bottom:4px;left:50%;
transform:translateX(-50%);width:4px;height:4px;background:var(--accent);border-radius:50%}
.dock-add{width:56px;height:56px;border:2px dashed var(--border);background:transparent;
color:var(--text-dim);border-radius:20px;font-size:26px;cursor:pointer;flex:0 0 56px;
display:flex;align-items:center;justify-content:center}
.dock-add:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
align-items:flex-end;justify-content:center;z-index:200;
backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal.open{display:flex}
.modal-card{background:var(--bg-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
padding:20px;width:100%;max-width:500px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
max-height:88vh;display:flex;flex-direction:column;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:translateY(0);opacity:1}}
.modal h2{margin:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-.4px}
.modal-head{display:flex;align-items:center;justify-content:space-between;
margin-bottom:14px;gap:12px}
.modal-head h2{margin:0}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:14px}
@media (max-width:340px){.swatches{grid-template-columns:repeat(4,1fr)}}
.swatch{aspect-ratio:1;border:none;border-radius:50%;cursor:pointer;padding:0;position:relative}
.swatch:active{transform:scale(.88)}
.swatch.active{box-shadow:0 0 0 2px var(--bg-2),0 0 0 4px currentColor}
.color-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.color-input{width:44px;height:44px;border:2px solid var(--border);border-radius:14px;
cursor:pointer;padding:0;background:transparent;overflow:hidden}
.color-input::-webkit-color-swatch-wrapper{padding:2px}
.color-input::-webkit-color-swatch{border:none;border-radius:10px}
.setting-block{padding:12px 0;border-bottom:1px solid var(--border)}
.setting-block:last-of-type{border-bottom:none}
.setting-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;
letter-spacing:.4px;font-weight:600;margin-bottom:10px}
.setting-hint{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.4}
.total-display{font-size:15px;color:var(--text);padding:10px 0;font-weight:500}
.total-display b{color:var(--accent);font-weight:700}
.counter-row{display:flex;align-items:center;gap:12px;padding:4px 0}
.counter-btn{width:44px;height:44px;border:1px solid var(--border);background:var(--bg-3);
color:var(--text);border-radius:14px;font-size:22px;font-weight:600;cursor:pointer;
font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.counter-btn:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.num-value{flex:1;text-align:center;font-size:22px;font-weight:700;
padding:10px;border-radius:14px;background:var(--bg-3);cursor:pointer;
min-height:44px;display:flex;align-items:center;justify-content:center}
.num-value:active{background:var(--accent-soft);color:var(--accent)}
.btn{width:100%;min-height:50px;border:none;background:var(--bg-3);color:var(--text);
border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:rgba(255,59,48,.12);color:#ff3b30}
.btn:active{opacity:.8}
.btn+.btn{margin-top:8px}
.task-list{max-height:40vh;overflow-y:auto;overscroll-behavior:contain;margin-bottom:12px;
display:flex;flex-direction:column;gap:8px}
.task-row{display:flex;align-items:center;gap:8px;background:var(--bg-3);
border-radius:var(--radius-sm);padding:4px 4px 4px 8px;min-height:48px}
.task-text{flex:1;font-size:15px;word-break:break-word;padding:8px 4px;cursor:text}
.task-text.done{text-decoration:line-through;opacity:.55;color:var(--text-dim)}
.task-edit-input,.name-edit-input{flex:1;background:transparent;border:none;
color:var(--text);font-size:15px;font-family:inherit;outline:none;padding:8px 0;
border-bottom:2px solid var(--accent)}
.name-edit-input{font-weight:700;font-size:15px}
.checkbox{width:26px;height:26px;min-width:26px;border-radius:50%;
border:2px solid var(--text-muted);background:transparent;cursor:pointer;padding:0;
display:inline-flex;align-items:center;justify-content:center;position:relative;
color:var(--cb-color,var(--accent))}
.checkbox::before{content:'';position:absolute;inset:-9px}
.checkbox svg{width:15px;height:15px;display:block}
.checkbox.checked{background:var(--cb-color,var(--accent));border-color:var(--cb-color,var(--accent))}
.add-row{display:flex;gap:8px}
.add-row input,.modal-input{flex:1;background:var(--bg-3);border:1px solid var(--border);
color:var(--text);font-size:15px;font-family:inherit;padding:12px 14px;
border-radius:var(--radius-sm);min-height:var(--tap);outline:none;width:100%}
.add-row input:focus,.modal-input:focus{border-color:var(--accent)}
.modal-input{margin-bottom:10px}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--bg-3);border:none;
cursor:pointer;position:relative;padding:0;transition:background .2s;flex:none}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;
border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}
.notify-toggle-row{display:flex;justify-content:space-between;align-items:center;
padding:8px 0 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.day-select{display:flex;gap:6px;flex-wrap:wrap}
.day-select button{min-width:40px;min-height:40px;border:1px solid var(--border);
background:var(--bg-3);color:var(--text-dim);border-radius:12px;font-size:13px;
font-weight:600;cursor:pointer;font-family:inherit;flex:1}
.day-select button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.preset-tile{padding:16px 12px;border:2px solid var(--border);background:var(--bg-3);
color:var(--text);border-radius:var(--radius-sm);font-size:14px;font-weight:600;
cursor:pointer;font-family:inherit;text-align:center;display:flex;flex-direction:column;
align-items:center;gap:6px;min-height:80px;justify-content:center}
.preset-tile.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.preset-tile-icon{font-size:24px;line-height:1}
.preset-tile-label{font-size:13px}
.preset-tile-sub{font-size:11px;font-weight:500;opacity:.7}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;
transform:translate(-50%,20px);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;
border-radius:20px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;
transition:opacity .2s,transform .2s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{color:var(--text-dim);font-size:12px;margin:16px 0 0;text-align:center;line-height:1.5}
.version-tag{text-align:center;color:var(--text-dim);font-size:11px;
margin-top:20px;padding-top:12px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1 id="pageTitle">Планировщик</h1>
    <div class="header-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Поиск">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" id="editBtn" aria-label="Режим редактирования">✏️</button>
      <button class="icon-btn" id="settingsBtn" aria-label="Настройки">⚙️</button>
    </div>
  </header>
  <div class="search-overlay" id="searchOverlay">
    <div class="search-field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="globalSearch" placeholder="Поиск: слово, день, дата..." autocomplete="off">
      <button class="close-search" id="searchClose">✕</button>
    </div>
  </div>
  <div id="content"></div>
</div>
<nav class="dock" id="dock"></nav>

<div class="modal" id="settingsModal"><div class="modal-card">
<h2>Настройки</h2>
<div id="moduleSettings"></div>
<div class="setting-block">
  <div class="setting-label">Тема</div>
  <div style="display:flex;gap:8px">
    <button class="btn" data-theme-set="light" style="flex:1">☀️ Светлая</button>
    <button class="btn" data-theme-set="dark" style="flex:1">🌙 Тёмная</button>
  </div>
</div>
<div id="moduleDelete"></div>
<button class="btn primary" data-close style="margin-top:16px">Готово</button>
<div class="version-tag" id="versionTag">Версия 14.0</div>
</div></div>

<div class="modal" id="cellModal"><div class="modal-card">
<div class="modal-head">
  <h2 id="cellTitle">Ячейка</h2>
  <button class="icon-btn" data-close>✕</button>
</div>
<div class="setting-block">
  <div class="setting-label">Цвет</div>
  <div class="swatches" id="cellSwatches"></div>
  <div class="color-row">
    <input type="color" id="cellColorCustom" class="color-input">
    <span style="font-size:13px;color:var(--text-dim)">Свой цвет</span>
  </div>
</div>
<div class="setting-block">
  <div class="setting-label">Уведомления</div>
  <div class="notify-toggle-row">
    <span style="font-weight:500">Включить</span>
    <button class="toggle" id="cellNotifyToggle"></button>
  </div>
  <div id="cellNotifyFields" style="display:none">
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:6px">Время</div>
    <input type="time" id="cellNotifyTime" class="modal-input">
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:6px;margin-top:8px">Дни</div>
    <div class="day-select" id="cellDaySelect"></div>
  </div>
</div>
<button class="btn danger" id="cellDeleteBtn">Удалить ячейку</button>
<button class="btn primary" data-close style="margin-top:8px">Готово</button>
</div></div>

<div class="modal" id="tasksModal"><div class="modal-card">
<div class="modal-head">
  <h2 id="tasksTitle">Задачи</h2>
  <button class="icon-btn" data-close>✕</button>
</div>
<div class="task-list" id="taskList"></div>
<div class="add-row">
  <input type="text" id="newTask" placeholder="Новая задача..." autocomplete="off">
  <button class="icon-btn" id="addTaskBtn">+</button>
</div>
</div></div>

<div class="modal" id="createViewModal"><div class="modal-card">
<h2>Новый модуль</h2>
<div class="setting-block">
  <div class="setting-label">Название</div>
  <input type="text" id="newViewName" class="modal-input" placeholder="Календарь, Дневник…" autocomplete="off">
</div>
<div class="setting-block">
  <div class="setting-label">Иконка</div>
  <input type="text" id="newViewIcon" class="modal-input" value="📆" maxlength="2" style="text-align:center;font-size:24px">
</div>
<div class="setting-block">
  <div class="setting-label">Шаблон</div>
  <div class="preset-grid" id="presetGrid">
    <button class="preset-tile" data-preset="empty">
      <span class="preset-tile-icon">📋</span>
      <span class="preset-tile-label">Пустой</span>
      <span class="preset-tile-sub">Пн-Пт</span>
    </button>
    <button class="preset-tile active" data-preset="week">
      <span class="preset-tile-icon">🗓</span>
      <span class="preset-tile-label">Неделя</span>
      <span class="preset-tile-sub">Пн-Вс</span>
    </button>
    <button class="preset-tile" data-preset="week-dates">
      <span class="preset-tile-icon">📅</span>
      <span class="preset-tile-label">Неделя</span>
      <span class="preset-tile-sub">с датами</span>
    </button>
    <button class="preset-tile" data-preset="month">
      <span class="preset-tile-icon">📆</span>
      <span class="preset-tile-label">Месяц</span>
      <span class="preset-tile-sub">с датами</span>
    </button>
  </div>
</div>
<button class="btn primary" id="createViewBtn">Создать</button>
<button class="btn" data-close style="margin-top:8px">Отмена</button>
</div></div>

<div class="modal" id="confirmModal"><div class="modal-card">
<h2>Удалить?</h2>
<p id="confirmText" style="color:var(--text-dim);margin:0 0 16px;font-size:14px"></p>
<button class="btn danger" id="confirmYes">Удалить</button>
<button class="btn" data-close style="margin-top:8px">Отмена</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand();
  if (typeof tg.disableVerticalSwipes === 'function') { try { tg.disableVerticalSwipes(); } catch(e){} } }
document.addEventListener('contextmenu', e => e.preventDefault());
console.log('MiniApp v14.0 loaded');

const BOT_API = '';
const STORAGE_KEY = 'miniapp-constructor-v14';
const CARD_PALETTE = ['#5ac8fa','#af52de','#ff2d55','#ff9500','#34c759','#30b0c7','#5856d6','#ffcc00'];
const ACCENT_PALETTE = ['#007aff','#5856d6','#af52de','#ff2d55','#ff9500','#34c759','#30b0c7','#8e8e93'];
const DAY_NAMES = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DAY_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const DEFAULT_NOTIFY = {enabled:false,time:'08:00',days:[]};
const DEFAULT_HEIGHT = 96;
const MIN_HEIGHT = 60;
const MAX_HEIGHT = 800;
const LONG_PRESS_MS = 400;
const SEARCH_SYNONYMS = {
  'пн':['пн','пон','понедельник','mon','monday','1'],
  'вт':['вт','вто','вторник','tue','tuesday','2'],
  'ср':['ср','сре','среда','wed','wednesday','3'],
  'чт':['чт','чет','четверг','thu','thursday','4'],
  'пт':['пт','пят','пятница','fri','friday','5'],
  'сб':['сб','суб','суббота','sat','saturday','6'],
  'вс':['вс','вос','воскресенье','sun','sunday','7','0'],
};

function makeId(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function makeTask(text){return {id:makeId('t'),text,done:false};}
function makeCell(name,idx,days){
  return {id:makeId('c'),name:name||'',color:CARD_PALETTE[idx%8],
    colSpan:1,height:DEFAULT_HEIGHT,tasks:[],notify:{...DEFAULT_NOTIFY,days:days||[]}};
}
function hexToRgba(hex,alpha){
  let h=String(hex||'').replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const r=parseInt(h.substring(0,2),16)||0;
  const g=parseInt(h.substring(2,4),16)||0;
  const b=parseInt(h.substring(4,6),16)||0;
  return `rgba(${r},${g},${b},${alpha})`;
}
function formatDate(d){
  const day=String(d.getDate()).padStart(2,'0');
  const month=String(d.getMonth()+1).padStart(2,'0');
  return day+'.'+month;
}
function parseGridRow(s){const m=String(s||'').match(/^(\d+)/);return m?parseInt(m[1])-1:0;}
function parseGridCol(s){const m=String(s||'').match(/^(\d+)/);return m?parseInt(m[1])-1:0;}

function isTodayCell(cell){
  if(!cell||!cell.name)return false;
  const now=new Date();
  const day=String(now.getDate()).padStart(2,'0');
  const month=String(now.getMonth()+1).padStart(2,'0');
  const year=now.getFullYear();
  const variants=[day+'.'+month,day+'.'+month+'.'+year,now.getDate()+'.'+(now.getMonth()+1)];
  const dow=(now.getDay()+6)%7;
  const shortDay=DAY_NAMES[dow].toLowerCase();
  const fullDay=DAY_FULL[dow];
  const nm=cell.name.toLowerCase();
  if(variants.some(v=>nm.includes(v)))return true;
  if(nm===shortDay||nm===fullDay)return true;
  if(nm.includes(shortDay+' ')||nm.includes(fullDay))return true;
  return false;
}

function migrateView(view){
  if(Array.isArray(view.columns)){
    view.columnCount=Math.max(1,view.columns.length);
    view.cells=view.columns.flat();
    delete view.columns;
  }
  if(typeof view.columnCount!=='number')view.columnCount=1;
  if(!Array.isArray(view.cells))view.cells=[];
  view.cells.forEach(c=>{
    if(typeof c.colSpan!=='number')c.colSpan=1;
    if(typeof c.height!=='number')c.height=DEFAULT_HEIGHT;
  });
  if(typeof view.rowsPerColumn!=='number'||view.rowsPerColumn<1){
    view.rowsPerColumn=Math.max(1,Math.ceil(view.cells.length/Math.max(1,view.columnCount)));
  }
  return view;
}

function makeDefaultView(){
  const cells=DAY_NAMES.map((n,i)=>makeCell(n,i,[i]));
  return {id:'v_planner',type:'planner',title:'Планировщик',icon:'📅',removable:false,
    columnCount:1,rowsPerColumn:7,cells,filter:'all'};
}
function makeDefaultState(){
  return {theme:'light',accent:'#007aff',currentViewId:'v_planner',views:[makeDefaultView()]};
}
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(s&&typeof s==='object'&&Array.isArray(s.views)&&s.views.length){
      s.views=s.views.map(migrateView);
      return s;
    }
  }catch(e){}
  return makeDefaultState();
}
let state=loadState();
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
  pushToBackend();
}
let currentViewId=state.currentViewId||state.views[0].id;
let searchQuery='';
let currentCellId=null;
let dragState=null;
let longPressTimer=null;
let suppressClick=false;
let confirmCallback=null;
let editMode=false;
let selectedPreset='week';
let layoutPriority=null;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer=null;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2000);}
function haptic(t='light'){try{tg?.HapticFeedback?.impactOccurred(t);}catch(e){}}

function getUserId(){return tg?.initDataUnsafe?.user?.id||null;}
async function pushToBackend(){
  if(!BOT_API)return;
  const uid=getUserId();if(!uid)return;
  try{await fetch(BOT_API.replace(/\/$/,'')+'/api/sync',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,state})});}catch(e){}
}
async function pullFromBackend(){
  if(!BOT_API)return false;
  const uid=getUserId();if(!uid)return false;
  try{
    const r=await fetch(BOT_API.replace(/\/$/,'')+'/api/state/'+uid);
    if(!r.ok)return false;
    const data=await r.json();
    if(!data.ok||!data.state)return false;
    mergeDone(state,data.state);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
    return true;
  }catch(e){return false;}
}
function mergeDone(local,remote){
  const lookup={};
  (remote.views||[]).forEach(v=>(v.cells||[]).forEach(c=>
    (c.tasks||[]).forEach(t=>{lookup[t.id]=t;})));
  (local.views||[]).forEach(v=>(v.cells||[]).forEach(c=>
    (c.tasks||[]).forEach(t=>{
      if(lookup[t.id]&&typeof lookup[t.id].done==='boolean')t.done=lookup[t.id].done;
    })));
}
setInterval(async()=>{if(await pullFromBackend()){renderContent();}},30000);

function applyTheme(){
  document.documentElement.dataset.theme=state.theme;
  try{const c=state.theme==='dark'?'#1c1c1e':'#f5f5f7';
    tg?.setHeaderColor?.(c);tg?.setBackgroundColor?.(c);}catch(e){}
}
function applyAccent(){
  document.documentElement.style.setProperty('--accent',state.accent);
  const [r,g,b]=[1,3,5].map(i=>parseInt(state.accent.slice(i,i+2),16));
  document.documentElement.style.setProperty('--accent-soft',`rgba(${r},${g},${b},0.16)`);
}

function expandSearchWord(word){
  for(const syns of Object.values(SEARCH_SYNONYMS)){
    if(syns.includes(word))return syns;
  }
  return [word];
}
function getSearchWords(){
  if(!searchQuery)return [];
  return searchQuery.split(/\s+/).filter(Boolean);
}
function matchCell(cell,words){
  if(!words.length)return true;
  const hay=(cell.name+' '+cell.tasks.map(t=>t.text).join(' ')).toLowerCase();
  return words.every(w=>{
    const syns=expandSearchWord(w);
    return syns.some(s=>hay.includes(s));
  });
}
function highlightText(text,words){
  if(!words.length)return escapeHtml(text);
  const allForms=new Set();
  words.forEach(w=>expandSearchWord(w).forEach(s=>allForms.add(s)));
  const escaped=[...allForms].map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp('('+escaped.sort((a,b)=>b.length-a.length).join('|')+')','gi');
  return escapeHtml(text).replace(re,'<mark>$1</mark>');
}

function updateDockSize(){
  const dock=$('#dock');if(!dock)return;
  const avail=window.innerWidth-24;
  dock.style.maxWidth=avail+'px';
  const scroll=dock.querySelector('.dock-scroll');
  if(!scroll)return;
  const availForScroll=avail-16-56-6;
  scroll.style.maxWidth=Math.max(100,availForScroll)+'px';
}

function renderDock(){
  const dock=$('#dock');dock.innerHTML='';
  const scroll=document.createElement('div');scroll.className='dock-scroll';
  for(const v of state.views){
    const btn=document.createElement('button');
    btn.className='dock-item'+(v.id===currentViewId?' active':'');
    btn.innerHTML=`<span aria-hidden="true">${v.icon}</span>`;
    btn.addEventListener('click',()=>{if(v.id===currentViewId)return;haptic();switchView(v.id);});
    scroll.appendChild(btn);
  }
  dock.appendChild(scroll);
  const addBtn=document.createElement('button');
  addBtn.className='dock-add';addBtn.textContent='+';
  addBtn.addEventListener('click',()=>{
    haptic();
    $('#newViewName').value='';$('#newViewIcon').value='📆';
    selectedPreset='week';
    $$('#presetGrid .preset-tile').forEach(t=>t.classList.toggle('active',t.dataset.preset==='week'));
    openModal($('#createViewModal'));
    const inp=$('#newViewName');
    if(inp){
      inp.focus();
      setTimeout(()=>{try{inp.focus();inp.click();}catch(e){}},80);
      setTimeout(()=>{try{inp.focus();}catch(e){}},350);
    }
  });
  dock.appendChild(addBtn);
  updateDockSize();
  requestAnimationFrame(updateDockSize);
}

function switchView(viewId){
  currentViewId=viewId;
  state.currentViewId=viewId;
  saveState();
  const v=state.views.find(x=>x.id===viewId);
  $('#pageTitle').textContent=v?.title||'';
  renderDock();renderContent();closeSearch();
  window.scrollTo({top:0,behavior:'instant'});
  setTimeout(()=>scrollToToday(v),350);
}

function scrollToToday(view){
  if(!view)return;
  const grid=$('#columnsContainer');if(!grid)return;
  for(const cell of view.cells){
    if(!isTodayCell(cell))continue;
    const card=grid.querySelector(`[data-cell-id="${cell.id}"]`);
    if(!card)continue;
    const rect=card.getBoundingClientRect();
    const visible=rect.top>=20&&rect.bottom<=window.innerHeight-120;
    if(!visible){
      card.scrollIntoView({behavior:'smooth',block:'center'});
    }
    return;
  }
}

function renderContent(){
  const c=$('#content');c.innerHTML='';
  const v=state.views.find(x=>x.id===currentViewId);
  if(!v){switchView(state.views[0].id);return;}
  renderPlanner(c,v);
  layoutPriority=null;
  document.body.classList.toggle('edit-mode',editMode);
  $('#editBtn').classList.toggle('active',editMode);
}

function renderPlanner(root,view){
  root.innerHTML=`
    <div class="filters" id="plannerFilters"></div>
    <div class="col-nav" id="colNav"></div>
    <div class="columns-container" id="columnsContainer"></div>
    <p class="hint">${editMode?'Режим редактирования: тащите карточку — переставить. Боковой ползунок — ширина, нижний уголок — высота.':'Тап на имя — переименовать. Тап на поле — задачи. ⚙️ — настройки. ✏️ — редактирование.'}</p>`;
  renderFilters(view);
  renderColNav(view);
  renderGrid(view,layoutPriority);
  $('#plannerFilters').addEventListener('click',e=>{
    const b=e.target.closest('[data-filter]');if(!b)return;
    view.filter=b.dataset.filter;saveState();
    renderFilters(view);renderGrid(view);haptic();
  });
  $('#colNav').addEventListener('click',e=>{
    const b=e.target.closest('[data-col]');if(!b)return;
    scrollToColumn(parseInt(b.dataset.col));
    $$('#colNav button').forEach(x=>x.classList.toggle('active',x===b));
    haptic();
  });
}

function renderFilters(view){
  const f=$('#plannerFilters');if(!f)return;
  const items=[{k:'all',t:'Все'},{k:'busy',t:'С задачами'},{k:'empty',t:'Свободные'}];
  f.innerHTML='';
  for(const it of items){
    const b=document.createElement('button');
    b.dataset.filter=it.k;b.textContent=it.t;
    b.className=(view.filter||'all')===it.k?'active':'';
    f.appendChild(b);
  }
}

function renderColNav(view){
  const nav=$('#colNav');if(!nav)return;
  nav.innerHTML='';
  if(view.columnCount<=1)return;
  for(let i=0;i<view.columnCount;i++){
    const b=document.createElement('button');
    b.dataset.col=i;b.textContent=i+1;
    nav.appendChild(b);
  }
}

function scrollToColumn(idx){
  const container=$('#columnsContainer');if(!container)return;
  const total=container.scrollWidth-container.clientWidth;
  if(total<=0)return;
  const perCol=total/Math.max(1,(currentViewColumnCount()-1));
  container.scrollTo({left:perCol*idx,behavior:'smooth'});
}
function currentViewColumnCount(){
  const v=state.views.find(x=>x.id===currentViewId);
  return v?v.columnCount:1;
}

function computeLayout(cells,N,priority){
  const occupied=new Set();
  const result=[];
  const isFree=(r,c,span)=>{
    if(c+span>N)return false;
    for(let i=c;i<c+span;i++)if(occupied.has(r+','+i))return false;
    return true;
  };
  const mark=(r,c,span)=>{for(let i=c;i<c+span;i++)occupied.add(r+','+i);};
  let ordered=[...cells];
  if(priority){
    const idx=ordered.findIndex(c=>c.id===priority.cellId);
    if(idx>0){const[p]=ordered.splice(idx,1);ordered.unshift(p);}
  }
  for(const cell of ordered){
    const span=Math.min(Math.max(1,cell.colSpan||1),N);
    let placed=false;
    if(priority&&cell.id===priority.cellId&&priority.preferredRow!=null&&priority.preferredCol!=null){
      const r=priority.preferredRow,c=priority.preferredCol;
      if(isFree(r,c,span)){result.push({cell,row:r,col:c,span});mark(r,c,span);placed=true;}
    }
    if(!placed){
      for(let r=0;r<5000&&!placed;r++){
        for(let c=0;c+span<=N;c++){
          if(isFree(r,c,span)){
            result.push({cell,row:r,col:c,span});mark(r,c,span);placed=true;break;
          }
        }
      }
    }
  }
  return result;
}

function renderGrid(view,priority){
  const container=$('#columnsContainer');if(!container)return;
  container.innerHTML='';
  const N=Math.max(1,view.columnCount);
  container.style.gridTemplateColumns=`repeat(${N}, minmax(120px, 1fr))`;
  const words=getSearchWords();
  const visible=view.cells.filter(cell=>{
    const mq=matchCell(cell,words);
    const f=view.filter||'all';
    const mf=f==='all'?true:f==='busy'?cell.tasks.length>0:f==='empty'?cell.tasks.length===0:true;
    return mq&&mf;
  });
  if(!visible.length){
    container.innerHTML='<p class="empty">Нет подходящих</p>';
    return;
  }
  const layout=computeLayout(visible,N,priority||null);
  layout.forEach(({cell,row,col,span})=>{
    const card=buildCellCard(view,cell,words);
    card.style.gridRow=(row+1)+' / span 1';
    card.style.gridColumn=(col+1)+' / span '+span;
    container.appendChild(card);
  });
}

function buildCellCard(view,cell,words){
  const card=document.createElement('div');
  card.className='day-card'+(isTodayCell(cell)?' is-today':'');
  card.dataset.cellId=cell.id;
  card.dataset.draggable='true';
  card.draggable=false;
  card.style.setProperty('--card-color',cell.color);
  card.style.minHeight=(cell.height||DEFAULT_HEIGHT)+'px';
  card.style.maxHeight=(cell.height||DEFAULT_HEIGHT)+'px';
  const nameHtml=cell.name?highlightText(cell.name,words):'Назовите';
  const tasksBg=hexToRgba(cell.color,0.12);
  card.innerHTML=`
    <div class="day-head">
      <div class="day-name${cell.name?'':' empty-name'}" data-name>${nameHtml}</div>
      <div class="day-actions">
        <button class="mini-btn" data-settings>⚙️</button>
      </div>
    </div>
    <div class="cell-tasks" data-tasks style="background:${tasksBg}">
      ${cell.tasks.length?cell.tasks.map(t=>`
        <div class="cell-task">
          <button class="cell-checkbox${t.done?' checked':''}" data-toggle="${t.id}" style="--cb-color:${cell.color}">
            ${t.done?'<svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-8"/></svg>':''}
          </button>
          <span class="cell-task-text${t.done?' done':''}" data-text="${t.id}">${highlightText(t.text,words)}</span>
        </div>
      `).join(''):'<div class="cell-empty">Нажмите, чтобы добавить задачи</div>'}
    </div>
    <div class="resize-handle" data-resize></div>
    <div class="width-handle" data-width></div>`;

  card.querySelector('[data-name]').addEventListener('click',e=>{
    e.stopPropagation();
    const el=e.currentTarget;
    startInlineEdit(el,cell.name||'',true,n=>{
      cell.name=n||'';saveState();
      el.innerHTML=cell.name?highlightText(cell.name,getSearchWords()):'Назовите';
      el.classList.toggle('empty-name',!cell.name);
      card.classList.toggle('is-today',isTodayCell(cell));
    });
  });
  card.querySelector('[data-settings]').addEventListener('click',e=>{
    e.stopPropagation();openCellModal(cell);
  });
  card.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const task=cell.tasks.find(t=>t.id===btn.dataset.toggle);
      if(task){task.done=!task.done;saveState();haptic();refreshCard(card,cell,view);}
    });
  });
  card.querySelectorAll('[data-text]').forEach(span=>{
    span.addEventListener('click',e=>{
      e.stopPropagation();
      const task=cell.tasks.find(t=>t.id===span.dataset.text);
      if(!task)return;
      startInlineEdit(span,task.text,false,n=>{
        task.text=n||task.text;saveState();refreshCard(card,cell,view);
      });
    });
  });
  card.addEventListener('click',e=>{
    if(editMode)return;
    if(suppressClick){suppressClick=false;return;}
    if(e.target.closest('[data-name],[data-settings],[data-toggle],[data-text],[data-resize],[data-width]'))return;
    openTasksModal(cell);
  });
  card.addEventListener('pointerdown',e=>{
    if(e.target.closest('[data-name],[data-settings],[data-toggle],[data-text],[data-resize],[data-width]'))return;
    if(e.button&&e.button!==0)return;
    if(editMode){startDrag(card,cell,view);}
    else{longPressTimer=setTimeout(()=>startDrag(card,cell,view),LONG_PRESS_MS);}
  });
  const cancelPress=()=>{if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}};
  card.addEventListener('pointerup',cancelPress);
  card.addEventListener('pointercancel',cancelPress);
  card.addEventListener('pointermove',cancelPress);

  card.querySelector('[data-resize]').addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
    startHeightResize(e,card,cell,view);
  });
  card.querySelector('[data-width]').addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
    startWidthResize(e,card,cell,view);
  });
  return card;
}

function startHeightResize(e,card,cell,view){
  const startY=e.clientY;
  const startHeight=cell.height||DEFAULT_HEIGHT;
  haptic();
  const move=ev=>{
    const dy=ev.clientY-startY;
    cell.height=Math.max(MIN_HEIGHT,Math.min(MAX_HEIGHT,startHeight+dy));
    card.style.minHeight=cell.height+'px';
    card.style.maxHeight=cell.height+'px';
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    saveState();haptic('medium');
  };
  document.addEventListener('pointermove',move,{passive:false});
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}

function startWidthResize(e,card,cell,view){
  const startX=e.clientX;
  const startSpan=cell.colSpan||1;
  const startRow=parseGridRow(card.style.gridRow);
  const startCol=parseGridCol(card.style.gridColumn);
  const grid=$('#columnsContainer');
  const rect=grid.getBoundingClientRect();
  const gapPx=10;
  haptic();
  const move=ev=>{
    const dx=ev.clientX-startX;
    const colWidth=(rect.width-gapPx*Math.max(0,view.columnCount-1))/Math.max(1,view.columnCount);
    const delta=Math.round(dx/(colWidth+gapPx));
    let newSpan=startSpan+delta;
    if(newSpan<1)newSpan=1;
    if(newSpan>view.columnCount){
      view.columnCount=newSpan;
      view.rowsPerColumn=Math.max(1,Math.ceil(view.cells.length/view.columnCount));
      grid.style.gridTemplateColumns=`repeat(${view.columnCount}, minmax(120px, 1fr))`;
    }
    cell.colSpan=newSpan;
    card.style.gridColumn=(startCol+1)+' / span '+newSpan;
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    saveState();haptic('medium');
    layoutPriority={cellId:cell.id,preferredRow:startRow,preferredCol:startCol};
    renderContent();
  };
  document.addEventListener('pointermove',move,{passive:false});
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}

function refreshCard(card,cell,view){
  const tasksBox=card.querySelector('[data-tasks]');
  if(!tasksBox)return;
  const words=getSearchWords();
  tasksBox.style.background=hexToRgba(cell.color,0.12);
  card.style.setProperty('--card-color',cell.color);
  card.classList.toggle('is-today',isTodayCell(cell));
  if(!cell.tasks.length){
    tasksBox.innerHTML='<div class="cell-empty">Нажмите, чтобы добавить задачи</div>';
    return;
  }
  tasksBox.innerHTML=cell.tasks.map(t=>`
    <div class="cell-task">
      <button class="cell-checkbox${t.done?' checked':''}" data-toggle="${t.id}" style="--cb-color:${cell.color}">
        ${t.done?'<svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-8"/></svg>':''}
      </button>
      <span class="cell-task-text${t.done?' done':''}" data-text="${t.id}">${highlightText(t.text,words)}</span>
    </div>
  `).join('');
  tasksBox.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const task=cell.tasks.find(t=>t.id===btn.dataset.toggle);
      if(task){task.done=!task.done;saveState();haptic();refreshCard(card,cell,view);}
    });
  });
  tasksBox.querySelectorAll('[data-text]').forEach(span=>{
    span.addEventListener('click',e=>{
      e.stopPropagation();
      const task=cell.tasks.find(t=>t.id===span.dataset.text);
      if(!task)return;
      startInlineEdit(span,task.text,false,n=>{
        task.text=n||task.text;saveState();refreshCard(card,cell,view);
      });
    });
  });
}

function startInlineEdit(el,oldText,isName,onSave){
  const input=document.createElement('input');
  input.type='text';input.value=oldText;
  input.className=isName?'name-edit-input':'task-edit-input';
  el.replaceWith(input);input.focus();
  input.setSelectionRange(input.value.length,input.value.length);
  let done=false;
  const finish=save=>{
    if(done)return;done=true;
    const v=input.value.trim();
    input.replaceWith(el);
    onSave(save?v:oldText);
  };
  input.addEventListener('blur',()=>finish(true));
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();input.blur();}
    else if(e.key==='Escape'){e.preventDefault();finish(false);}
  });
}

function startDrag(card,cell,view){
  longPressTimer=null;
  haptic('medium');
  suppressClick=true;
  dragState={card,cell,view,target:null};
  card.classList.add('dragging');
  const move=ev=>{
    if(!dragState)return;
    ev.preventDefault();
    $$('.drag-target').forEach(el=>el.classList.remove('drag-target'));
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    const target=el?.closest('[data-draggable]');
    if(target&&target!==card){target.classList.add('drag-target');dragState.target=target;}
    else dragState.target=null;
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    endDrag();
  };
  document.addEventListener('pointermove',move,{passive:false});
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}

function endDrag(){
  if(!dragState){suppressClick=false;return;}
  const{cell,view,target}=dragState;
  let priority=null;
  if(target){
    const targetRow=parseGridRow(target.style.gridRow);
    const targetCol=parseGridCol(target.style.gridColumn);
    const targetId=target.dataset.cellId;
    const cells=view.cells;
    const sIdx=cells.indexOf(cell);
    if(sIdx>=0)cells.splice(sIdx,1);
    const tIdx=cells.findIndex(c=>c.id===targetId);
    if(tIdx>=0)cells.splice(tIdx,0,cell);
    else cells.push(cell);
    priority={cellId:cell.id,preferredRow:targetRow,preferredCol:targetCol};
    saveState();haptic('medium');
  }
  dragState?.card?.classList.remove('dragging');
  $$('.drag-target').forEach(el=>el.classList.remove('drag-target'));
  dragState=null;
  setTimeout(()=>{suppressClick=false;},100);
  layoutPriority=priority;
  renderContent();
}

function openTasksModal(cell){
  currentCellId=cell.id;
  $('#tasksTitle').textContent=cell.name||'Задачи';
  $('#newTask').value='';
  renderTasksList(cell);
  openModal($('#tasksModal'));
}

function renderTasksList(cell){
  const list=$('#taskList');list.innerHTML='';
  if(!cell.tasks.length){
    list.innerHTML='<p class="empty">Задач нет. Добавьте первую ↓</p>';return;
  }
  cell.tasks.forEach(task=>{
    const row=document.createElement('div');row.className='task-row';
    const cb=document.createElement('button');
    cb.className='checkbox'+(task.done?' checked':'');
    cb.style.setProperty('--cb-color',cell.color);
    cb.innerHTML=task.done?'<svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-8"/></svg>':'';
    cb.addEventListener('click',()=>{
      task.done=!task.done;saveState();renderTasksList(cell);refreshCellsInView(cell);
    });
    row.appendChild(cb);
    const txt=document.createElement('span');
    txt.className='task-text'+(task.done?' done':'');txt.textContent=task.text;
    txt.addEventListener('click',()=>{
      startInlineEdit(txt,task.text,false,n=>{
        task.text=n||task.text;saveState();renderTasksList(cell);refreshCellsInView(cell);
      });
    });
    row.appendChild(txt);
    const del=document.createElement('button');
    del.className='mini-btn';del.textContent='✕';
    del.addEventListener('click',()=>{
      const i=cell.tasks.indexOf(task);if(i>=0)cell.tasks.splice(i,1);
      saveState();renderTasksList(cell);refreshCellsInView(cell);
    });
    row.appendChild(del);list.appendChild(row);
  });
}

function refreshCellsInView(cell){
  const cards=$$(`[data-cell-id="${cell.id}"]`);
  const view=state.views.find(v=>v.id===currentViewId);
  cards.forEach(card=>refreshCard(card,cell,view));
}

function getCurrentCell(){
  const v=state.views.find(x=>x.id===currentViewId);if(!v)return null;
  return v.cells.find(c=>c.id===currentCellId)||null;
}

function openCellModal(cell){
  currentCellId=cell.id;
  $('#cellTitle').textContent=cell.name||'Ячейка';
  renderCellSwatches(cell);
  $('#cellColorCustom').value=cell.color;
  const n=cell.notify||DEFAULT_NOTIFY;
  $('#cellNotifyToggle').classList.toggle('on',!!n.enabled);
  $('#cellNotifyFields').style.display=n.enabled?'block':'none';
  $('#cellNotifyTime').value=n.time||'08:00';
  renderCellDaySelect(cell);
  openModal($('#cellModal'));
}

function renderCellSwatches(cell){
  const wrap=$('#cellSwatches');wrap.innerHTML='';
  for(const c of CARD_PALETTE){
    const b=document.createElement('button');
    b.className='swatch'+(c===cell.color?' active':'');
    b.style.background=c;b.style.color=c;
    b.addEventListener('click',()=>{
      cell.color=c;saveState();renderCellSwatches(cell);
      $('#cellColorCustom').value=c;refreshCellsInView(cell);
    });
    wrap.appendChild(b);
  }
}

function renderCellDaySelect(cell){
  const sel=$('#cellDaySelect');sel.innerHTML='';
  const days=cell.notify?.days||[];
  DAY_NAMES.forEach((lbl,i)=>{
    const b=document.createElement('button');
    b.textContent=lbl;b.className=days.includes(i)?'on':'';
    b.addEventListener('click',()=>{
      if(!cell.notify.days)cell.notify.days=[];
      const idx=cell.notify.days.indexOf(i);
      if(idx>=0)cell.notify.days.splice(idx,1);else cell.notify.days.push(i);
      b.classList.toggle('on',cell.notify.days.includes(i));
      saveState();
    });
    sel.appendChild(b);
  });
}

function openModal(m){m.classList.add('open');document.body.style.overflow='hidden';updateBack();}
function closeModal(m){m.classList.remove('open');
  if(!$$('.modal.open').length)document.body.style.overflow='';updateBack();}
function updateBack(){if(!tg?.BackButton)return;
  if($$('.modal.open').length)tg.BackButton.show();else tg.BackButton.hide();}

function renderSettings(){
  const v=state.views.find(x=>x.id===currentViewId);if(!v)return;
  $$('[data-theme-set]').forEach(b=>{
    b.style.background=b.dataset.themeSet===state.theme?'var(--accent)':'var(--bg-3)';
    b.style.color=b.dataset.themeSet===state.theme?'#fff':'var(--text)';
  });
  const rows=Math.max(1,v.rowsPerColumn||Math.ceil(v.cells.length/Math.max(1,v.columnCount)));
  const ms=$('#moduleSettings');
  ms.innerHTML=`
    <div class="setting-block">
      <div class="setting-label">Название модуля</div>
      <input type="text" class="modal-input" id="moduleTitleInput" value="${escapeHtml(v.title)}">
      <div class="setting-label">Иконка</div>
      <input type="text" class="modal-input" id="moduleIconInput" value="${escapeHtml(v.icon)}" maxlength="2" style="text-align:center;font-size:22px">
    </div>
    <div class="setting-block">
      <div class="setting-label">Акцентный цвет</div>
      <div class="swatches" id="accentSwatches"></div>
      <div class="color-row">
        <input type="color" id="accentCustom" class="color-input" value="${state.accent}">
        <span style="font-size:13px;color:var(--text-dim)">Свой цвет</span>
      </div>
    </div>
    <div class="setting-block">
      <div class="setting-label">Структура сетки</div>
      <div class="total-display">Итого: <b>${v.cells.length}</b> ячеек = <b>${v.columnCount}</b> столбцов × <b>${rows}</b> ячеек в столбце</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;margin-top:8px">Столбцов</div>
      <div class="counter-row">
        <button class="counter-btn" id="colsMinus">−</button>
        <div class="num-value" id="colsValue">${v.columnCount}</div>
        <button class="counter-btn" id="colsPlus">+</button>
      </div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;margin-top:14px">Ячеек в столбце</div>
      <div class="counter-row">
        <button class="counter-btn" id="rowsMinus">−</button>
        <div class="num-value" id="rowsValue">${rows}</div>
        <button class="counter-btn" id="rowsPlus">+</button>
      </div>
      <div class="setting-hint">При изменении пустые ячейки добавляются или удаляются автоматически, чтобы получилось ровно «столбцы × ячейки в столбце». Пример: 2 столбца × 5 ячеек = 10 ячеек.</div>
    </div>
    <div class="setting-block">
      <div class="setting-label">Сброс модуля</div>
      <button class="btn danger" id="resetModuleBtn">Сбросить «${escapeHtml(v.title)}»</button>
    </div>`;
  const sw=$('#accentSwatches');sw.innerHTML='';
  for(const c of ACCENT_PALETTE){
    const b=document.createElement('button');
    b.className='swatch'+(c===state.accent?' active':'');
    b.style.background=c;b.style.color=c;
    b.addEventListener('click',()=>{state.accent=c;saveState();applyAccent();renderSettings();});
    sw.appendChild(b);
  }
  $('#accentCustom').addEventListener('input',e=>{state.accent=e.target.value;saveState();applyAccent();});
  $('#moduleTitleInput').addEventListener('change',e=>{
    const t=e.target.value.trim();if(!t)return;
    v.title=t;saveState();$('#pageTitle').textContent=t;renderDock();
  });
  $('#moduleIconInput').addEventListener('change',e=>{
    const t=e.target.value.trim()||'📆';v.icon=t;saveState();renderDock();
  });
  $('#colsMinus').addEventListener('click',()=>{applyColumnCount(v,v.columnCount-1);});
  $('#colsPlus').addEventListener('click',()=>{applyColumnCount(v,v.columnCount+1);});
  $('#colsValue').addEventListener('click',()=>{
    const n=prompt('Сколько столбцов?',v.columnCount);
    if(n===null)return;
    const num=parseInt(n);if(isNaN(num)||num<1)return;
    applyColumnCount(v,num);
  });
  $('#rowsMinus').addEventListener('click',()=>{applyRowsPerColumn(v,rows-1);});
  $('#rowsPlus').addEventListener('click',()=>{applyRowsPerColumn(v,rows+1);});
  $('#rowsValue').addEventListener('click',()=>{
    const n=prompt('Сколько ячеек в столбце?',rows);
    if(n===null)return;
    const num=parseInt(n);if(isNaN(num)||num<1)return;
    applyRowsPerColumn(v,num);
  });
  $('#resetModuleBtn').addEventListener('click',()=>{
    askConfirm(`Сбросить модуль «${v.title}»?`,`reset:${v.id}`);
  });
  const del=$('#moduleDelete');
  if(v.removable){
    del.innerHTML=`<div class="setting-block">
      <div class="setting-label">Удалить модуль</div>
      <button class="btn danger" id="deleteModuleBtn">Удалить «${escapeHtml(v.title)}»</button>
    </div>`;
    $('#deleteModuleBtn').addEventListener('click',()=>{
      askConfirm(`Удалить модуль «${v.title}»?`,`delete:${v.id}`);
    });
  } else del.innerHTML='';
}

function applyColumnCount(v,newCols){
  if(newCols<1)newCols=1;
  const rows=Math.max(1,v.rowsPerColumn||Math.ceil(v.cells.length/Math.max(1,v.columnCount)));
  const target=newCols*rows;
  v.columnCount=newCols;
  v.rowsPerColumn=rows;
  resizeCellsTo(v,target);
  saveState();renderContent();renderSettings();
}

function applyRowsPerColumn(v,newRows){
  if(newRows<1)newRows=1;
  const cols=Math.max(1,v.columnCount);
  const target=cols*newRows;
  v.rowsPerColumn=newRows;
  v.columnCount=cols;
  resizeCellsTo(v,target);
  saveState();renderContent();renderSettings();
}

function resizeCellsTo(v,target){
  if(target<1)target=1;
  if(target<v.cells.length){
    v.cells=v.cells.slice(0,target);
  } else {
    while(v.cells.length<target){
      v.cells.push(makeCell('',v.cells.length,[]));
    }
  }
  v.cells.forEach(c=>{c.colSpan=Math.min(c.colSpan||1,v.columnCount);});
}

function askConfirm(text,action){
  $('#confirmText').textContent=text;
  confirmCallback=action;
  openModal($('#confirmModal'));
}

function openSearch(){$('#searchOverlay').classList.add('open');
  setTimeout(()=>$('#globalSearch').focus(),100);}
function closeSearch(){$('#searchOverlay').classList.remove('open');
  $('#globalSearch').value='';if(searchQuery){searchQuery='';renderContent();}}

function generatePresetCells(preset){
  if(preset==='empty'){
    return DAY_NAMES.slice(0,5).map((n,i)=>makeCell(n,i,[i]));
  }
  if(preset==='week'){
    return DAY_NAMES.map((n,i)=>makeCell(n,i,[i]));
  }
  if(preset==='week-dates'){
    const cells=[];
    const today=new Date();
    const dow=(today.getDay()+6)%7;
    const monday=new Date(today);
    monday.setDate(today.getDate()-dow);
    for(let i=0;i<7;i++){
      const d=new Date(monday);
      d.setDate(monday.getDate()+i);
      cells.push(makeCell(DAY_NAMES[i]+' '+formatDate(d),i,[i]));
    }
    return cells;
  }
  if(preset==='month'){
    const cells=[];
    const now=new Date();
    const year=now.getFullYear();
    const month=now.getMonth();
    const daysInMonth=new Date(year,month+1,0).getDate();
    for(let i=1;i<=daysInMonth;i++){
      const d=new Date(year,month,i);
      const dayIdx=(d.getDay()+6)%7;
      cells.push(makeCell(formatDate(d),i-1,[dayIdx]));
    }
    return cells;
  }
  return DAY_NAMES.map((n,i)=>makeCell(n,i,[i]));
}

function createView(){
  const name=$('#newViewName').value.trim();
  const icon=$('#newViewIcon').value.trim()||'📆';
  if(!name){toast('Введите название');return;}
  const cells=generatePresetCells(selectedPreset);
  const columnCount=(selectedPreset==='month'||selectedPreset==='week-dates')?7:1;
  const rowsPerColumn=Math.max(1,Math.ceil(cells.length/columnCount));
  const newView={id:makeId('v'),type:'planner',title:name,icon,removable:true,
    filter:'all',columnCount,rowsPerColumn,cells};
  state.views.push(newView);
  saveState();
  closeModal($('#createViewModal'));
  switchView(newView.id);
  toast('Модуль «'+name+'» создан');haptic();
}

window.addEventListener('resize',updateDockSize);

$('#searchBtn').addEventListener('click',openSearch);
$('#searchClose').addEventListener('click',closeSearch);
$('#globalSearch').addEventListener('input',e=>{
  searchQuery=e.target.value.trim().toLowerCase();renderContent();
});
$('#editBtn').addEventListener('click',()=>{
  editMode=!editMode;haptic();
  document.body.classList.toggle('edit-mode',editMode);
  $('#editBtn').classList.toggle('active',editMode);
  renderContent();
});
$('#settingsBtn').addEventListener('click',()=>{renderSettings();openModal($('#settingsModal'));});
$('#settingsModal').addEventListener('click',e=>{
  const t=e.target.closest('[data-theme-set]');
  if(t){state.theme=t.dataset.themeSet;applyTheme();saveState();renderSettings();}
});
$('#presetGrid').addEventListener('click',e=>{
  const t=e.target.closest('[data-preset]');
  if(!t)return;
  selectedPreset=t.dataset.preset;
  $$('#presetGrid .preset-tile').forEach(x=>x.classList.toggle('active',x===t));
  haptic();
});
$('#cellColorCustom').addEventListener('input',e=>{
  const cell=getCurrentCell();if(!cell)return;
  cell.color=e.target.value;saveState();renderCellSwatches(cell);refreshCellsInView(cell);
});
$('#cellNotifyToggle').addEventListener('click',()=>{
  const cell=getCurrentCell();if(!cell)return;
  const on=!$('#cellNotifyToggle').classList.contains('on');
  $('#cellNotifyToggle').classList.toggle('on',on);
  $('#cellNotifyFields').style.display=on?'block':'none';
  if(!cell.notify)cell.notify={...DEFAULT_NOTIFY};
  cell.notify.enabled=on;saveState();haptic();
});
$('#cellNotifyTime').addEventListener('change',e=>{
  const cell=getCurrentCell();if(!cell)return;
  if(!cell.notify)cell.notify={...DEFAULT_NOTIFY};
  cell.notify.time=e.target.value||'08:00';saveState();
});
$('#cellDeleteBtn').addEventListener('click',()=>{
  const cell=getCurrentCell();if(!cell)return;
  askConfirm(`Удалить ячейку «${cell.name||'без имени'}»?`,`deleteCell:${cell.id}`);
});
$('#addTaskBtn').addEventListener('click',()=>{
  const inp=$('#newTask');const text=inp.value.trim();if(!text)return;
  const cell=getCurrentCell();if(!cell)return;
  cell.tasks.push(makeTask(text));inp.value='';
  saveState();renderTasksList(cell);refreshCellsInView(cell);haptic();
});
$('#newTask').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();$('#addTaskBtn').click();}
});
$('#createViewBtn').addEventListener('click',createView);
$('#confirmYes').addEventListener('click',()=>{
  const action=confirmCallback;confirmCallback=null;
  closeModal($('#confirmModal'));
  if(!action)return;
  if(action.startsWith('delete:')){
    const id=action.slice(7);
    state.views=state.views.filter(v=>v.id!==id);
    if(currentViewId===id)currentViewId=state.views[0].id;
    state.currentViewId=currentViewId;
    saveState();renderDock();renderContent();
  } else if(action.startsWith('reset:')){
    const id=action.slice(6);
    const v=state.views.find(x=>x.id===id);
    if(v){
      v.cells=generatePresetCells('week');
      v.columnCount=1;
      v.rowsPerColumn=7;
      saveState();renderContent();
    }
    closeModal($('#settingsModal'));
  } else if(action.startsWith('deleteCell:')){
    const id=action.slice(11);
    const v=state.views.find(x=>x.id===currentViewId);if(!v)return;
    v.cells=v.cells.filter(c=>c.id!==id);
    if(!v.cells.length)v.cells=[makeCell('',0,[])];
    v.rowsPerColumn=Math.max(1,Math.ceil(v.cells.length/v.columnCount));
    v.cells.forEach(c=>{c.colSpan=Math.min(c.colSpan||1,v.columnCount);});
    saveState();closeModal($('#cellModal'));renderContent();
  }
});
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.closest('.modal'))));
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m);}));
$('#pageTitle').addEventListener('click',function(){
  const v=state.views.find(x=>x.id===currentViewId);if(!v)return;
  startInlineEdit(this,v.title,true,n=>{
    v.title=n||v.title;this.textContent=v.title;saveState();renderDock();
  });
});
if(tg?.BackButton){
  tg.BackButton.onClick(()=>{
    const o=$$('.modal.open');
    if(o.length){o.forEach(closeModal);return;}
    if(searchQuery)closeSearch();
  });
}
(function init(){
  applyTheme();applyAccent();
  if(!state.views.find(v=>v.id===currentViewId)){currentViewId=state.views[0].id;}
  renderDock();
  switchView(currentViewId);
  updateBack();
  pullFromBackend().then(()=>renderContent());
})();
</script>
