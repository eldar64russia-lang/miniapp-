<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Конструктор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
--bg:#f5f5f7;--bg2:#fff;--bg3:#ececf0;--text:#1d1d1f;--dim:#86868b;--muted:#c7c7cc;
--border:#e0e0e5;--accent:#007aff;--soft:rgba(0,122,255,.12);
--sh1:0 1px 3px rgba(0,0,0,.06);--sh2:0 4px 12px rgba(0,0,0,.08);
--sh3:0 10px 30px rgba(0,0,0,.12);
--r-sm:12px;--r:16px;--r-lg:24px;
--sheet:rgba(255,255,255,.94);--dock-bg:rgba(255,255,255,.85);
--card:rgba(255,255,255,.85);--badge:rgba(0,0,0,.06);--badge-t:#555;
}
[data-theme="dark"]{
--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f5f5f7;--dim:#98989d;--muted:#48484a;
--border:#38383a;--accent:#0a84ff;--soft:rgba(10,132,255,.2);
--sh1:0 1px 3px rgba(0,0,0,.2);--sh2:0 4px 12px rgba(0,0,0,.3);--sh3:0 10px 30px rgba(0,0,0,.4);
--sheet:rgba(44,44,46,.95);--dock-bg:rgba(44,44,46,.9);
--card:rgba(44,44,46,.85);--badge:rgba(255,255,255,.1);--badge-t:#b0b0b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
font-size:15px;line-height:1.35;min-height:100vh;overscroll-behavior-y:contain}
.app{max-width:720px;margin:0 auto;padding:12px 14px calc(140px + env(safe-area-inset-bottom));
padding-top:calc(12px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:44px}
.title-block{flex:1;min-width:0}
#title{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.today{font-size:11px;color:var(--dim);margin-top:2px}
.top-actions{display:flex;gap:6px;flex:none}
.icon-btn{width:44px;height:44px;border:none;background:var(--bg3);color:var(--text);
border-radius:var(--r-sm);font-size:17px;cursor:pointer;padding:0;
display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.icon-btn:active{background:var(--soft);transform:scale(.94)}
.icon-btn.active{background:var(--soft);color:var(--accent)}

/* === Сетка === */
.grid-wrap{overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.grid-wrap::-webkit-scrollbar{display:none}
.grid{display:grid;gap:10px;align-items:start}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
border-radius:var(--r);padding:10px 10px 10px 14px;box-shadow:var(--sh1);
position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;
gap:5px;min-width:0;min-height:96px;transition:box-shadow .15s}
.card::before{content:'';position:absolute;top:10px;left:0;bottom:10px;width:3px;
background:var(--accent);border-radius:0 2px 2px 0}
.card:active{box-shadow:var(--sh2)}
.card.today{box-shadow:0 0 0 1.5px var(--accent),var(--sh1)}
.card.today::before{width:5px}
.card.flash{animation:flash 1.8s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent),var(--sh2)}100%{box-shadow:var(--sh1)}}
body.editing .card{outline:2px dashed var(--border);outline-offset:-2px;cursor:grab;touch-action:none}

/* === Шапка карточки === */
.card-head{display:flex;align-items:center;gap:6px;min-height:32px;max-height:32px;
padding-left:4px;overflow:hidden;flex-wrap:nowrap}
.badge{background:var(--badge);color:var(--badge-t);font-size:11px;font-weight:700;
padding:3px 6px;border-radius:6px;flex:none;line-height:1;white-space:nowrap}
.badge.is-today{background:var(--accent);color:#fff}
.cell-name{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.cell-name.empty{color:var(--muted);font-weight:500;font-style:italic;font-size:13px}
.card-actions{display:flex;gap:2px;flex:none;align-items:center}
.mini-btn{width:26px;height:26px;border:none;background:transparent;color:var(--dim);
border-radius:6px;font-size:13px;cursor:pointer;padding:0;position:relative;
display:inline-flex;align-items:center;justify-content:center}
.mini-btn::before{content:'';position:absolute;inset:-9px}
.mini-btn:active{background:var(--soft);color:var(--accent)}
.mini-btn.on{color:var(--accent)}
.mini-btn.on::after{content:'';position:absolute;top:2px;right:2px;width:6px;height:6px;
background:var(--accent);border-radius:50%}

/* === Задачи в карточке === */
.cell-tasks{display:flex;flex-direction:column;gap:2px;padding:4px 6px;
border-radius:10px;background:var(--soft);flex:1;min-height:0;overflow-y:auto}
.ctask{display:flex;align-items:flex-start;gap:6px;padding:1px 0;font-size:12px;
line-height:1.3;min-width:0}
.ctask-cb{width:15px;height:15px;min-width:15px;border-radius:50%;
border:1.5px solid var(--muted);background:transparent;cursor:pointer;padding:0;
position:relative;display:flex;align-items:center;justify-content:center;
color:var(--accent);margin-top:1px}
.ctask-cb.checked{background:var(--accent);border-color:var(--accent)}
.ctask-cb::before{content:'';position:absolute;inset:-10px}
.ctask-cb svg{width:9px;height:9px;display:block}
.ctask-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.ctask-text.done{text-decoration:line-through;opacity:.55}
.empty-tasks{font-size:11px;color:var(--dim);font-style:italic;padding:4px 0}
.count-tasks{font-size:13px;color:var(--dim);font-weight:500;padding:6px 4px}

/* === Resize-ручки === */
.resize-w,.resize-h{display:none;position:absolute;background:var(--accent);
color:#fff;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;
font-weight:700;font-size:14px;line-height:1;align-items:center;justify-content:center;
touch-action:none;z-index:20}
body.editing .resize-w,body.editing .resize-h{display:flex}
.resize-w{right:2px;top:50%;transform:translateY(-50%);width:24px;height:48px;
border-radius:12px;cursor:ew-resize;font-size:16px}
.resize-h{right:2px;bottom:2px;width:24px;height:24px;border-radius:12px;cursor:ns-resize}

/* === Dock === */
.dock{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;
transform:translateX(-50%);background:var(--dock-bg);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border:1px solid var(--border);border-radius:var(--r-lg);
padding:8px;display:flex;gap:6px;align-items:center;box-shadow:var(--sh3);
z-index:100;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock-btn{width:52px;height:52px;border:none;background:transparent;
border-radius:16px;font-size:22px;cursor:pointer;padding:0;flex:none;
display:flex;align-items:center;justify-content:center;position:relative}
.dock-btn.active{background:var(--soft)}
.dock-btn.active::after{content:'';position:absolute;bottom:3px;left:50%;
transform:translateX(-50%);width:4px;height:4px;background:var(--accent);border-radius:50%}
.dock-btn.add{border:2px dashed var(--border);color:var(--dim);font-size:24px}
.dock-delete{position:absolute;top:-4px;right:-4px;width:22px;height:22px;
border-radius:11px;background:#ff3b30;color:#fff;border:2px solid var(--bg);
font-size:11px;font-weight:700;cursor:pointer;padding:0;z-index:2;
display:none;align-items:center;justify-content:center;font-family:inherit;
box-shadow:0 2px 6px rgba(0,0,0,.3)}
body.editing .dock-delete{display:flex}

/* === Edit toolbar === */
.edit-bar{display:none;position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));
left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);
border-radius:var(--r-lg);padding:6px;gap:6px;align-items:center;
box-shadow:var(--sh3);z-index:99;max-width:calc(100vw - 20px);
overflow-x:auto;scrollbar-width:none}
.edit-bar::-webkit-scrollbar{display:none}
body.editing .edit-bar{display:flex}
.edit-bar-btn{min-height:42px;padding:0 12px;border:none;border-radius:12px;
background:var(--bg3);color:var(--text);font-size:13px;font-weight:600;
cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;
justify-content:center;gap:5px;white-space:nowrap;flex:none}
.edit-bar-btn:active{opacity:.7}
.edit-bar-btn:disabled{opacity:.35;cursor:not-allowed}
.edit-bar-btn.undo{background:rgba(255,149,0,.15);color:#ff9500}
.edit-bar-btn.apply{background:var(--accent);color:#fff}
.edit-bar-btn.apply-col{background:var(--soft);color:var(--accent)}

/* === Модалки === */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
align-items:flex-end;justify-content:center;z-index:200;
backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.open{display:flex}
.sheet{background:var(--sheet);backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);
border-radius:var(--r-lg) var(--r-lg) 0 0;border:1px solid var(--border);border-bottom:none;
padding:18px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;
max-height:92vh;display:flex;flex-direction:column;overflow-y:auto;gap:10px;
animation:up .2s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;
gap:10px;margin-bottom:4px}
.sheet-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sheet-title h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-title .sub{font-size:12px;color:var(--dim);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-actions{display:flex;gap:2px;flex:none}
.sheet h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--dim);text-transform:uppercase;
letter-spacing:.3px;font-weight:600}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--border);
background:var(--bg3);color:var(--text);font-size:15px;font-family:inherit;
border-radius:12px;outline:none;min-height:44px}
.field input:focus,.field select:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.btn{min-height:48px;padding:0 16px;border:none;border-radius:12px;
background:var(--bg3);color:var(--text);font-size:15px;font-weight:600;
cursor:pointer;font-family:inherit;width:100%}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:rgba(255,59,48,.12);color:#ff3b30}
.btn:active{opacity:.8}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;width:auto}

.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.swatch{aspect-ratio:1;border:none;border-radius:50%;cursor:pointer;padding:0}
.swatch.active{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--accent)}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--bg3);
border:none;cursor:pointer;position:relative;padding:0;flex:none}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;
border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);
transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}

/* Задачи в модалке */
.tasks-list{display:flex;flex-direction:column;gap:6px;max-height:45vh;
overflow-y:auto;margin-bottom:6px}
.task-item{display:flex;align-items:center;gap:10px;padding:10px 12px;
background:var(--bg3);border-radius:12px;min-height:52px}
.task-item .cb{width:26px;height:26px;min-width:26px;border-radius:50%;
border:2px solid var(--muted);background:transparent;cursor:pointer;padding:0;
display:inline-flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.task-item .cb.checked{background:var(--accent);border-color:var(--accent)}
.task-item .cb svg{width:14px;height:14px}
.task-item .txt{flex:1;font-size:15px;cursor:text;word-break:break-word;min-width:0}
.task-item .txt.done{text-decoration:line-through;opacity:.55}
.task-item .del{width:28px;height:28px;border:none;background:transparent;
color:var(--dim);cursor:pointer;padding:0;border-radius:8px;font-size:14px;flex:none}
.task-item .del:active{background:rgba(255,59,48,.15);color:#ff3b30}
.add-task{display:flex;gap:8px;align-items:center;background:var(--bg3);
border-radius:12px;padding:4px 4px 4px 14px;min-height:52px;border:1px solid transparent}
.add-task:focus-within{border-color:var(--accent)}
.add-task input{flex:1;background:transparent;border:none;color:var(--text);
font-size:15px;font-family:inherit;outline:none;padding:10px 0;min-width:0}
.add-task button{width:44px;height:44px;border:none;border-radius:10px;
background:var(--accent);color:#fff;font-size:22px;cursor:pointer;flex:none;padding:0}

/* Режимы уведомлений */
.notify-modes{display:flex;gap:6px;flex-wrap:wrap}
.notify-modes button{flex:1 1 calc(50% - 6px);min-width:110px;min-height:42px;
padding:0 10px;border:2px solid var(--border);background:var(--bg3);
color:var(--text);border-radius:12px;font-size:12px;font-weight:600;
cursor:pointer;font-family:inherit}
.notify-modes button.active{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.day-select{display:flex;gap:6px;flex-wrap:wrap}
.day-select button{flex:1;min-width:38px;min-height:38px;border:1px solid var(--border);
background:var(--bg3);color:var(--dim);border-radius:10px;font-size:13px;
font-weight:600;cursor:pointer;font-family:inherit}
.day-select button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Календарь */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-head button{width:36px;height:36px;border:1px solid var(--border);
background:var(--bg3);color:var(--text);border-radius:10px;cursor:pointer;
font-size:14px;padding:0}
.cal-title{font-weight:700;font-size:15px;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:var(--dim);font-weight:600;padding:4px 0}
.cal-day{aspect-ratio:1;min-height:34px;border:2px solid transparent;background:transparent;
color:var(--text);border-radius:8px;font-size:14px;font-weight:500;
cursor:pointer;padding:0;font-family:inherit;display:flex;
align-items:center;justify-content:center}
.cal-day:hover{background:var(--bg3)}
.cal-day.today{border-color:var(--soft);color:var(--accent);font-weight:700}
.cal-day.sel{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Список выбора ячеек */
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:36vh;
overflow-y:auto;padding:4px;background:var(--bg3);border-radius:12px}
.pick-item{display:flex;align-items:center;gap:10px;padding:8px 12px;
border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;
background:var(--bg2);border:none;color:var(--text);text-align:left;min-height:44px}
.pick-item.checked{background:var(--soft);color:var(--accent)}
.pick-cb{width:22px;height:22px;min-width:22px;border-radius:50%;
border:2px solid var(--muted);display:flex;align-items:center;
justify-content:center;color:#fff;font-size:12px;flex:none}
.pick-item.checked .pick-cb{background:var(--accent);border-color:var(--accent)}
.pick-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Пресеты */
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.preset{padding:14px 10px;border:2px solid var(--border);background:var(--bg3);
color:var(--text);border-radius:12px;font-size:13px;font-weight:600;
cursor:pointer;font-family:inherit;text-align:center;display:flex;
flex-direction:column;align-items:center;gap:4px;min-height:70px;
justify-content:center}
.preset.active{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.preset-icon{font-size:22px;line-height:1}
.preset-sub{font-size:11px;font-weight:500;opacity:.7}
.date-choices{display:flex;gap:6px;flex-wrap:wrap}
.date-choices button{flex:1;min-height:40px;border:2px solid var(--border);
background:var(--bg3);color:var(--text);border-radius:10px;font-size:12px;
font-weight:600;cursor:pointer;font-family:inherit}
.date-choices button.active{border-color:var(--accent);background:var(--soft);color:var(--accent)}

/* Инфо-блоки */
.info{padding:10px 12px;background:var(--bg3);border-radius:10px;
font-size:12px;color:var(--dim);line-height:1.5}
.info.accent{background:var(--soft);color:var(--accent)}

/* Settings блоки */
.set-block{padding:12px 0;border-bottom:1px solid var(--border)}
.set-block:last-child{border-bottom:none}
.set-label{font-size:12px;color:var(--dim);text-transform:uppercase;
letter-spacing:.3px;font-weight:600;margin-bottom:8px}
.total{font-size:14px;padding:12px 14px;background:var(--soft);color:var(--text);
border-radius:12px;text-align:center;line-height:1.5;margin-bottom:12px}
.total b{color:var(--accent);font-weight:800;font-size:16px}
.counter{display:flex;align-items:center;gap:10px;padding:4px 0}
.counter button{width:44px;height:44px;border:1px solid var(--border);
background:var(--bg3);color:var(--text);border-radius:12px;font-size:22px;
font-weight:600;cursor:pointer;font-family:inherit;padding:0}
.counter button:active{background:var(--soft);color:var(--accent)}
.counter .val{flex:1;text-align:center;font-size:20px;font-weight:800;
padding:8px;border-radius:12px;background:var(--bg3);cursor:pointer;
min-height:44px;display:flex;align-items:center;justify-content:center}
.label-sm{font-size:12px;color:var(--dim);margin-bottom:6px;margin-top:12px}

/* Toast */
.toast{position:fixed;bottom:calc(140px + env(safe-area-inset-bottom));
left:50%;transform:translate(-50%,20px);background:rgba(0,0,0,.88);
color:#fff;padding:11px 18px;border-radius:20px;font-size:13px;font-weight:500;
opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
z-index:400;max-width:90vw;text-align:center;line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Поиск */
.search-overlay{max-height:0;overflow:hidden;transition:max-height .2s,margin-bottom .2s;margin-bottom:0}
.search-overlay.open{max-height:60px;margin-bottom:10px}
.search-field{display:flex;align-items:center;gap:8px;background:var(--bg2);
border:1px solid var(--border);border-radius:12px;padding:0 12px;
min-height:44px;box-shadow:var(--sh1)}
.search-field input{flex:1;background:transparent;border:none;color:var(--text);
font-size:15px;outline:none;padding:10px 0;font-family:inherit}
.search-field input::-webkit-search-cancel-button{-webkit-appearance:none}
.search-field button{background:transparent;border:none;color:var(--dim);
font-size:15px;cursor:pointer;padding:4px;min-width:32px;min-height:32px}
.results-section{font-size:12px;color:var(--dim);text-transform:uppercase;
letter-spacing:.3px;font-weight:700;margin:14px 4px 8px}
.results-div{height:1px;background:var(--border);margin:20px 0 4px;
display:flex;align-items:center;justify-content:center;position:relative}
.results-div::after{content:'в других модулях';position:absolute;
background:var(--bg);color:var(--dim);font-size:11px;padding:0 12px;font-weight:600}
.search-hit{padding:12px 14px;background:var(--bg2);border-radius:12px;
border:1px solid var(--border);margin-bottom:8px;cursor:pointer;
font-family:inherit;text-align:left;color:var(--text);width:100%;
font-size:14px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:4px}
.search-hit:active{transform:scale(.98)}
.hit-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.hit-meta b{color:var(--text);font-weight:700}
.hit-module{font-weight:600;color:var(--accent)}
.hit-body{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px;margin:0}
.empty-sm{padding:16px;text-align:center;font-size:13px;color:var(--dim)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<script>
'use strict';
console.log('%cv25 LOADED','background:#007aff;color:#fff;padding:3px 8px;border-radius:4px;font-weight:bold');

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  if (typeof tg.disableVerticalSwipes === 'function') { try { tg.disableVerticalSwipes(); } catch(e){} }
}
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

var CARD_COLORS = ['#5ac8fa','#af52de','#ff2d55','#ff9500','#34c759','#30b0c7','#5856d6','#ffcc00'];
var ACCENT_COLORS = ['#007aff','#5856d6','#af52de','#ff2d55','#ff9500','#34c759','#30b0c7','#8e8e93'];
var DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var STORAGE_KEY = 'miniapp-v25';
var OLD_KEYS = ['miniapp-constructor-v23','miniapp-constructor-v22','miniapp-constructor-v21','miniapp-constructor-v20','miniapp-constructor-v19'];

function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function newId(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ if(!s) return null; var p=s.split('-'); if(p.length!==3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function fmtBadge(s){ var d=parseDate(s); return d ? pad(d.getDate())+'.'+pad(d.getMonth()+1) : ''; }
function fmtFull(d){ return d.getDate()+' '+MONTHS_GEN[d.getMonth()]+', '+(DAYS[(d.getDay()+6)%7]||''); }

function toast(msg){
  var el=$('#toast'); if(!el)return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){ el.classList.remove('show'); }, 2500);
}
function haptic(t){ try { if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred(t||'light'); } catch(e){} }

/* === Модель === */
function makeNotify(){ return {enabled:false,mode:'celldate',time:'09:00',date:null,days:[],monthDay:1,hourBefore:false,dayBefore:false}; }
function makeTask(text){ return {id:newId('t'),text:text,done:false}; }
function makeCell(name,date){
  return {id:newId('c'),name:name||'',date:date||null,color:CARD_COLORS[0],
    colSpan:1,height:96,tasks:[],notify:makeNotify()};
}
function makeView(title,icon,removable){
  return {id:newId('v'),title:title||'Модуль',icon:icon||'📆',removable:removable!==false,
    columnCount:7,cells:[]};
}

/* === Миграция === */
function migrateNotify(n){
  var o=makeNotify();
  if(!n||typeof n!=='object') return o;
  o.enabled=!!n.enabled;
  o.time=n.time||'09:00';
  var modes=['celldate','daily','weekly','monthly','once'];
  if(n.mode && modes.indexOf(n.mode)>=0) o.mode=n.mode;
  else if(n.mode==='smart') o.mode='celldate';
  if(n.date) o.date=n.date;
  if(n.monthDay) o.monthDay=n.monthDay;
  if(typeof n.hourBefore==='boolean') o.hourBefore=n.hourBefore;
  if(typeof n.dayBefore==='boolean') o.dayBefore=n.dayBefore;
  if(Array.isArray(n.days)){ o.days=n.days.filter(function(d){return typeof d==='number';}); }
  return o;
}
function migrateCell(c){
  if(!c||typeof c!=='object') return makeCell();
  var o=makeCell();
  if(c.id) o.id=c.id;
  if(typeof c.name==='string') o.name=c.name;
  if(typeof c.date==='string' && parseDate(c.date)) o.date=c.date;
  else o.date=null;
  if(typeof c.color==='string') o.color=c.color;
  var span = c.colSpan || c.widthMultiplier || 1;
  if(typeof span==='number' && span>0) o.colSpan=Math.min(10, Math.round(span));
  if(typeof c.height==='number') o.height=Math.max(60, Math.min(800, c.height));
  if(Array.isArray(c.tasks)){
    o.tasks=c.tasks.map(function(t){
      if(!t||typeof t!=='object') return null;
      return {id:t.id||newId('t'), text:String(t.text||''), done:!!t.done};
    }).filter(function(t){ return t && t.text; });
  }
  o.notify=migrateNotify(c.notify);
  return o;
}
function migrateView(v){
  if(!v||typeof v!=='object') return null;
  var o=makeView(v.title||'Модуль', v.icon||'📆', v.removable!==false);
  if(v.id) o.id=v.id;
  if(typeof v.columnCount==='number' && v.columnCount>=1) o.columnCount=Math.min(15, Math.round(v.columnCount));
  var rawCells = Array.isArray(v.cells) ? v.cells : (Array.isArray(v.columns) ? v.columns.flat() : []);
  o.cells = rawCells.map(migrateCell);
  return o;
}
function defaultState(){
  var v=makeView('Планировщик','📅',false);
  v.columnCount=7;
  for(var i=0;i<7;i++) v.cells.push(makeCell(DAYS[i],null));
  return {theme:'light', accent:'#007aff', currentViewId:v.id, views:[v]};
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      var s=JSON.parse(raw);
      if(s && Array.isArray(s.views) && s.views.length){
        var migrated=s.views.map(migrateView).filter(Boolean);
        if(migrated.length){
          s.views=migrated;
          if(!s.currentViewId || !s.views.find(function(x){return x.id===s.currentViewId;}))
            s.currentViewId=s.views[0].id;
          return s;
        }
      }
    }
  }catch(e){ console.warn('load v25',e); }
  for(var i=0;i<OLD_KEYS.length;i++){
    try{
      var raw2=localStorage.getItem(OLD_KEYS[i]);
      if(!raw2) continue;
      var s2=JSON.parse(raw2);
      if(!s2 || !Array.isArray(s2.views) || !s2.views.length) continue;
      var migrated2=s2.views.map(migrateView).filter(Boolean);
      if(migrated2.length){
        s2.views=migrated2;
        if(!s2.currentViewId || !s2.views.find(function(x){return x.id===s2.currentViewId;}))
          s2.currentViewId=s2.views[0].id;
        console.log('migrated from',OLD_KEYS[i]);
        return s2;
      }
    }catch(e){ console.warn('load old',OLD_KEYS[i],e); }
  }
  return defaultState();
}

var state = loadState();
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}

var ui = {
  editing:false,
  currentCellId:null,
  editingCellId:null,
  searchQuery:'',
  lastResizedCellId:null,
  newPreset:'week',
  newDateChoice:'month1',
  bindStart:null,
  bindStep:'1',
  bindTargets:{},
  notifyTarget:null,
  notifyData:null,
  notifyPick:{},
  undoStack:[],
  dragState:null,
  longPressTimer:null
};

function currentView(){
  var v = state.views.find(function(x){ return x.id===state.currentViewId; });
  if(!v){ v=state.views[0]; state.currentViewId=v.id; }
  return v;
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function pushUndo(){
  ui.undoStack.push(JSON.stringify(state));
  if(ui.undoStack.length>20) ui.undoStack.shift();
  updateUndoBtn();
}
function updateUndoBtn(){
  var b=$('#btnUndo'); if(b) b.disabled = ui.undoStack.length===0;
}
function doUndo(){
  if(!ui.undoStack.length) return;
  var prev=ui.undoStack.pop();
  try{
    state=JSON.parse(prev);
    saveState();
    updateTheme(); updateAccent();
    render(); renderSettings();
    toast('Отменено');
  }catch(e){ console.error(e); }
  updateUndoBtn();
}

function updateTheme(){
  document.documentElement.setAttribute('data-theme', state.theme||'light');
  try{
    if(tg){
      var c = state.theme==='dark'?'#1c1c1e':'#f5f5f7';
      tg.setHeaderColor && tg.setHeaderColor(c);
      tg.setBackgroundColor && tg.setBackgroundColor(c);
    }
  }catch(e){}
}
function updateAccent(){
  var c = state.accent || '#007aff';
  document.documentElement.style.setProperty('--accent', c);
  var r=parseInt(c.slice(1,3),16)||0, g=parseInt(c.slice(3,5),16)||0, b=parseInt(c.slice(5,7),16)||0;
  document.documentElement.style.setProperty('--soft', 'rgba('+r+','+g+','+b+',0.16)');
}

/* === Рендер === */
function render(){
  try{
    updateTheme(); updateAccent();
    var v=currentView();
    $('#title').textContent = v.title || '';
    $('#todayInfo').textContent = 'Сегодня — '+fmtFull(new Date());
    renderContent();
    renderDock();
  }catch(e){
    console.error('render err', e);
    var c=$('#content');
    if(c) c.innerHTML='<p class="empty" style="color:#ff3b30">Ошибка: '+esc(e.message)+'</p>';
  }
}

function renderContent(){
  var c=$('#content');
  c.innerHTML='';
  if(ui.searchQuery){
    renderSearch(c);
    return;
  }
  var v=currentView();
  var wrap=document.createElement('div');
  wrap.className='grid-wrap';
  var grid=document.createElement('div');
  grid.className='grid';
  var N=Math.max(1, v.columnCount);
  grid.style.gridTemplateColumns='repeat('+N+', minmax(80px, 1fr))';
  grid.style.minWidth = (N*80)+'px';

  if(!v.cells.length){
    grid.innerHTML='<p class="empty" style="grid-column:1/-1">Модуль пуст. Добавьте ячейки в настройках.</p>';
  } else {
    v.cells.forEach(function(cell, idx){
      var card = buildCard(cell, v);
      var span = Math.min(Math.max(1, cell.colSpan||1), N);
      card.style.gridColumn = 'span '+span;
      card.style.minHeight = (cell.height||96)+'px';
      grid.appendChild(card);
    });
  }
  wrap.appendChild(grid);
  c.appendChild(wrap);
  document.body.classList.toggle('editing', ui.editing);
  $('#btnEdit').classList.toggle('active', ui.editing);
  updateApplyButtons();
}

function buildCard(cell, view){
  var card=document.createElement('div');
  card.className='card'+(cell.date && cell.date===todayStr()?' today':'');
  card.setAttribute('data-cell', cell.id);

  var badge = '';
  if(cell.date){
    var isToday = cell.date===todayStr();
    badge = '<span class="badge'+(isToday?' is-today':'')+'">'+fmtBadge(cell.date)+'</span>';
  }
  var nameCls = cell.name ? 'cell-name' : 'cell-name empty';
  var nameText = cell.name ? esc(cell.name) : 'Назовите';
  var hasNotify = cell.notify && cell.notify.enabled;
  var isNarrow = (Math.min(cell.colSpan||1, view.columnCount) === 1 && view.columnCount >= 5);

  var head = document.createElement('div');
  head.className='card-head';
  head.innerHTML = badge +
    '<div class="'+nameCls+'" data-name>'+nameText+'</div>' +
    '<div class="card-actions">'+
      '<button class="mini-btn'+(hasNotify?' on':'')+'" data-notify title="Уведомления">🔔</button>'+
      '<button class="mini-btn" data-settings title="Настройки">⚙️</button>'+
    '</div>';
  card.appendChild(head);

  var tasks = document.createElement('div');
  tasks.className='cell-tasks';
  card.appendChild(tasks);
  renderTasksInCard(cell, tasks, isNarrow);

  if(ui.editing){
    var rh=document.createElement('div');
    rh.className='resize-w'; rh.textContent='↔'; rh.title='Ширина';
    rh.addEventListener('pointerdown', function(e){ e.stopPropagation(); e.preventDefault(); startWidthResize(e, card, cell, view); });
    card.appendChild(rh);
    var rh2=document.createElement('div');
    rh2.className='resize-h'; rh2.textContent='↕'; rh2.title='Высота';
    rh2.addEventListener('pointerdown', function(e){ e.stopPropagation(); e.preventDefault(); startHeightResize(e, card, cell, view); });
    card.appendChild(rh2);
  }

  head.querySelector('[data-name]').addEventListener('click', function(e){
    e.stopPropagation();
    inlineEdit(e.currentTarget, cell.name||'', function(val){
      cell.name=val; saveState(); render();
    });
  });
  head.querySelector('[data-notify]').addEventListener('click', function(e){
    e.stopPropagation(); openNotifyForCell(cell);
  });
  head.querySelector('[data-settings]').addEventListener('click', function(e){
    e.stopPropagation(); openCellModal(cell);
  });

  card.addEventListener('click', function(e){
    if(ui.editing) return;
    if(e.target.closest('.card-head, .cell-tasks, [data-name], [data-notify], [data-settings], .resize-w, .resize-h')) return;
    openTasksModal(cell);
  });

  card.addEventListener('pointerdown', function(e){
    if(!ui.editing) return;
    if(e.target.closest('.card-head, [data-name], [data-notify], [data-settings], .resize-w, .resize-h')) return;
    if(e.button && e.button!==0) return;
    startDrag(card, cell, view);
  });

  return card;
}

function renderTasksInCard(cell, container, isNarrow){
  container.innerHTML='';
  if(!cell.tasks.length){
    container.innerHTML='<div class="empty-tasks">Нажмите, чтобы добавить</div>';
    return;
  }
  if(isNarrow && cell.tasks.length > 1){
    container.innerHTML='<div class="count-tasks">'+cell.tasks.length+' задач</div>';
    return;
  }
  cell.tasks.forEach(function(t){
    var row=document.createElement('div');
    row.className='ctask';
    var cb=document.createElement('button');
    cb.className='ctask-cb'+(t.done?' checked':'');
    cb.innerHTML = t.done
      ? '<svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-8"/></svg>'
      : '';
    cb.addEventListener('click', function(e){
      e.stopPropagation();
      t.done=!t.done; saveState(); render();
    });
    row.appendChild(cb);
    var txt=document.createElement('span');
    txt.className='ctask-text'+(t.done?' done':'');
    txt.textContent=t.text;
    txt.addEventListener('click', function(e){
      e.stopPropagation();
      inlineEdit(txt, t.text, function(val){
        t.text=val||t.text; saveState(); render();
      });
    });
    row.appendChild(txt);
    container.appendChild(row);
  });
}

function inlineEdit(el, oldText, onSave){
  var input=document.createElement('input');
  input.type='text';
  input.value=oldText;
  input.style.cssText='flex:1;min-width:0;background:transparent;border:none;'+
    'color:inherit;font:inherit;padding:2px 0;border-bottom:2px solid var(--accent);outline:none';
  el.replaceWith(input);
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  var done=false;
  function finish(save){
    if(done) return; done=true;
    var v=input.value.trim();
    input.replaceWith(el);
    if(save && v && v!==oldText) onSave(v);
    else if(!save) onSave(null);
  }
  input.addEventListener('blur', function(){ finish(true); });
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); input.blur(); }
    else if(e.key==='Escape'){ e.preventDefault(); finish(false); }
  });
}

/* === Ресайз === */
function startHeightResize(e, card, cell, view){
  pushUndo();
  var startY=e.clientY, startH=cell.height||96;
  haptic();
  function move(ev){
    if(ev.cancelable) ev.preventDefault();
    cell.height = Math.max(60, Math.min(800, startH + (ev.clientY-startY)));
    card.style.minHeight=cell.height+'px';
  }
  function up(){
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    saveState(); ui.lastResizedCellId=cell.id; updateApplyButtons();
  }
  document.addEventListener('pointermove', move, {passive:false});
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

function startWidthResize(e, card, cell, view){
  pushUndo();
  var startX=e.clientX;
  var startSpan=cell.colSpan||1;
  var gridEl = card.parentElement;
  var containerW = gridEl ? gridEl.getBoundingClientRect().width : 300;
  var N = Math.max(1, view.columnCount);
  var colW = (containerW - 10*(N-1)) / N;
  haptic();
  var lastSpan=startSpan;
  function move(ev){
    if(ev.cancelable) ev.preventDefault();
    var dx=ev.clientX - startX;
    var delta=Math.round(dx / (colW+10));
    var span=Math.max(1, Math.min(N, startSpan + delta));
    if(span!==lastSpan){
      lastSpan=span;
      cell.colSpan=span;
      card.style.gridColumn='span '+span;
    }
  }
  function up(){
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    saveState(); ui.lastResizedCellId=cell.id;
    render(); updateApplyButtons();
    toast('Ширина: '+cell.colSpan+'/'+N);
  }
  document.addEventListener('pointermove', move, {passive:false});
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

function updateApplyButtons(){
  var has=!!ui.lastResizedCellId;
  var b1=$('#btnApplyModule'), b2=$('#btnApplyColumn');
  if(b1) b1.disabled=!has;
  if(b2) b2.disabled=!has;
}

function applySizeToModule(){
  if(!ui.lastResizedCellId) return;
  var v=currentView();
  var src=v.cells.find(function(c){return c.id===ui.lastResizedCellId;});
  if(!src) return;
  pushUndo();
  v.cells.forEach(function(c){ c.colSpan=src.colSpan; c.height=src.height; });
  saveState(); render(); toast('Применено ко всему модулю');
}
function applySizeToColumn(){
  if(!ui.lastResizedCellId) return;
  var v=currentView();
  var srcIdx=v.cells.findIndex(function(c){return c.id===ui.lastResizedCellId;});
  if(srcIdx<0) return;
  var src=v.cells[srcIdx];
  var baseCol=srcIdx % v.columnCount;
  pushUndo();
  var n=0;
  v.cells.forEach(function(c, i){
    if(i%v.columnCount===baseCol){ c.colSpan=src.colSpan; c.height=src.height; n++; }
  });
  saveState(); render(); toast('Применено к столбцу '+(baseCol+1)+' ('+n+' ячеек)');
}

/* === Drag === */
function startDrag(card, cell, view){
  haptic('medium');
  ui.dragState={card:card, cell:cell, view:view, target:null};
  card.style.opacity=0.5;
  function move(ev){
    if(!ui.dragState) return;
    if(ev.cancelable) ev.preventDefault();
    $$('.card').forEach(function(el){ el.style.outline=''; });
    var el=document.elementFromPoint(ev.clientX, ev.clientY);
    var target=el ? el.closest('.card') : null;
    if(target && target!==card){
      target.style.outline='2px solid var(--accent)';
      ui.dragState.target=target;
    } else {
      ui.dragState.target=null;
    }
  }
  function up(){
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    if(ui.dragState && ui.dragState.target){
      var targetId=ui.dragState.target.getAttribute('data-cell');
      var cells=view.cells;
      var sIdx=cells.indexOf(cell);
      if(sIdx>=0) cells.splice(sIdx, 1);
      var tIdx=cells.findIndex(function(c){return c.id===targetId;});
      if(tIdx>=0) cells.splice(tIdx, 0, cell);
      else cells.push(cell);
      pushUndo();
      saveState();
      haptic('medium');
    }
    $$('.card').forEach(function(el){ el.style.outline=''; el.style.opacity=''; });
    ui.dragState=null;
    render();
  }
  document.addEventListener('pointermove', move, {passive:false});
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

    btn.addEventListener('click', function(){

      else ui.notifyTarget.ids[cell.id]=true;

      btn.classList.toggle('checked', now);
      btn.querySelector('.pick-cb').textContent = now?'✓':'';
    });

  });

function renderCalendar(container, selected, onPick){
  if(!container) return;
  var viewDate = selected ? parseDate(selected) : new Date();
  if(!viewDate) viewDate = new Date();
  viewDate.setDate(1);
  function build(sel){
    var y=viewDate.getFullYear(), m=viewDate.getMonth();
    var first=new Date(y,m,1);
    var startW=(first.getDay()+6)%7;
    var dim=daysInMonth(y,m);
    var today=todayStr();
    var html='<div class="cal-head">'+
      '<button data-prev>◀</button>'+
      '<div class="cal-title">'+MONTHS[m]+' '+y+'</div>'+
      '<button data-next>▶</button></div><div class="cal-grid">';
    DAYS.forEach(function(d){ html+='<div class="cal-dow">'+d+'</div>'; });
    for(var i=0;i<startW;i++) html+='<div></div>';
    for(var d=1;d<=dim;d++){
      var ds=y+'-'+pad(m+1)+'-'+pad(d);
      var cls='cal-day';
      if(ds===today) cls+=' today';
      if(ds===sel) cls+=' sel';
      html+='<button class="'+cls+'" data-date="'+ds+'">'+d+'</button>';
    }
    html+='</div>';
    container.innerHTML=html;
    container.querySelector('[data-prev]').onclick=function(){ viewDate.setMonth(viewDate.getMonth()-1); build(sel); };
    container.querySelector('[data-next]').onclick=function(){ viewDate.setMonth(viewDate.getMonth()+1); build(sel); };
    Array.prototype.forEach.call(container.querySelectorAll('.cal-day'), function(b){
      b.onclick=function(){
        var d=b.getAttribute('data-date');
        onPick(d); build(d);
      };
    });
  }
  build(selected);
}

/* Модалка привязки дат */
function openBind(){
  var v=currentView();
  ui.bindStart = todayStr();

  ui.bindTargets = {};
  v.cells.forEach(function(c){ ui.bindTargets[c.id]=true; });
  $('#bindStart').value = ui.bindStart;

  $('#bindCustomWrap').style.display='none';
  renderBindPickList(v);
  updateBindPreview();
  openM('mBind');
}
function renderBindPickList(v){
  var list=$('#bindPickList'); list.innerHTML='';
  v.cells.forEach(function(cell, idx){
    var checked=!!ui.bindTargets[cell.id];
    var btn=document.createElement('button');
    btn.className='pick-item'+(checked?' checked':'');
    var lbl = '#'+(idx+1)+' '+(cell.date?fmtBadge(cell.date)+' ':'')+(cell.name||'Без имени');
    btn.innerHTML = '<span class="pick-cb">'+(checked?'✓':'')+'</span><span class="pick-label">'+esc(lbl)+'</span>';
    btn.addEventListener('click', function(){
      if(ui.bindTargets[cell.id]) delete ui.bindTargets[cell.id];
      else ui.bindTargets[cell.id]=true;
      var now=!!ui.bindTargets[cell.id];
      btn.classList.toggle('checked', now);
      btn.querySelector('.pick-cb').textContent = now?'✓':'';
      updateBindPreview();
    });
    list.appendChild(btn);
  });

function getBindStepDays(){
  if(ui.bindStep==='1') return 1;
  var v=parseInt($('#bindCustomStep').value);
  return isNaN(v)||v<1 ? 1 : v;
}
function updateBindPreview(){
  var v=currentView();
  var el=$('#bindPreview'); if(!el) return;
  var start = parseDate(ui.bindStart) || new Date();
  var step=getBindStepDays();
  var ordered=v.cells
    .map(function(c,i){ return {cell:c, idx:i}; })
    .filter(function(o){ return ui.bindTargets[o.cell.id]; })
    .sort(function(a,b){ return a.idx-b.idx; });
  if(!ordered.length){ el.textContent='Ничего не выбрано.'; el.classList.remove('accent'); return; }
  var cursor=new Date(start);
  var first='', last='';
  ordered.forEach(function(o, i){
    var ds=toDateStr(cursor);
    if(i===0) first=fmtBadge(ds);
    last=fmtBadge(ds);
    cursor=addDays(cursor, step);
  });
  el.classList.add('accent');
  el.textContent = ordered.length+' ячеек: с '+first+' по '+last;
}
function applyBind(){
  var v=currentView();
  var targetIds=ui.bindTargets;
  if(!Object.keys(targetIds).length){ toast('Выберите ячейки'); return; }
  var start = parseDate(ui.bindStart) || new Date();
  var step=getBindStepDays();
  pushUndo();
  var ordered=v.cells
    .map(function(c,i){ return {cell:c, idx:i}; })
    .filter(function(o){ return targetIds[o.cell.id]; })
    .sort(function(a,b){ return a.idx-b.idx; });
  var cursor=new Date(start);
  ordered.forEach(function(o){
    o.cell.date = toDateStr(cursor);
    cursor=addDays(cursor, step);
  });
  saveState(); closeM('mBind'); render();
  toast('Даты привязаны к '+ordered.length+' ячейкам');
}

    var t=new Date(); startDate = new Date(t.getFullYear(), t.getMonth(), 1);
  } else if(ui.newDateChoice==='today'){
    startDate = new Date();
  } else {
    var cd=$('#newCustomDate').value;
    if(!cd){ toast('Выберите дату'); return; }
    startDate = parseDate(cd) || new Date();
  }
  var cells=[];
  if(ui.newPreset==='empty'){
    for(var i=0;i<5;i++) cells.push(makeCell('',null));
  } else if(ui.newPreset==='week'){
    for(var j=0;j<7;j++){
      var d=addDays(startDate, j);
      cells.push(makeCell(DAYS[(d.getDay()+6)%7], toDateStr(d)));
    }
  } else if(ui.newPreset==='month'){
    if(ui.newDateChoice==='month1'){
      var y=startDate.getFullYear(), m=startDate.getMonth();
      var dim=daysInMonth(y,m);
      for(var k=0;k<dim;k++){
        var dd=new Date(y,m,k+1);
        cells.push(makeCell('', toDateStr(dd)));
      }
    } else {
      for(var kk=0;kk<30;kk++){
        var dd2=addDays(startDate, kk);
        cells.push(makeCell('', toDateStr(dd2)));
      }
    }
  } else if(ui.newPreset==='year'){
    var baseY=startDate.getFullYear(), baseM=startDate.getMonth();
    for(var y2=0;y2<12;y2++){
      var mm=baseM+y2;
      var yy=baseY+Math.floor(mm/12);
      var mmm=mm%12;
      var dd3=new Date(yy, mmm, 1);
      cells.push(makeCell(MONTHS[mmm], toDateStr(dd3)));
    }
  }
  var target=Math.ceil(cells.length/7)*7;
  while(cells.length<target) cells.push(makeCell('', null));
  var nv=makeView(title, icon, true);
  nv.columnCount=7;
  nv.cells=cells;
  state.views.push(nv);
  state.currentViewId=nv.id;
  saveState(); closeM('mCreate'); render();
  toast('Модуль «'+title+'» создан');
}

    '<div class="counter" data-kind="total">'+
    '<button data-op="-">−</button><div class="val" data-value="'+v.cells.length+'">'+v.cells.length+'</div><button data-op="+">+</button>'+
    '</div>'+
    '</div>'+
    '<div class="set-block">'+
    '<div class="set-label">Привязка дат</div>'+
    '<button class="btn" id="openBindBtn">📅 Привязать даты к ячейкам</button>'+
    '</div>'+
    '<div class="set-block">'+
    '<div class="set-label">Тема</div>'+
    '<div class="row">'+
    '<button class="btn '+(state.theme==='light'?'primary':'')+'" data-theme="light">☀️ Светлая</button>'+
    '<button class="btn '+(state.theme==='dark'?'primary':'')+'" data-theme="dark">🌙 Тёмная</button>'+
    '</div>'+
    '</div>';
  if(v.removable){
    html+='<div class="set-block"><div class="set-label">Удалить модуль</div>'+
      '<button class="btn danger" id="deleteModuleBtn">Удалить «'+esc(v.title)+'»</button></div>';
  }
  body.innerHTML=html;

  var titleInp=body.querySelector('.set-title-input');
  titleInp.addEventListener('change', function(e){
    var t=e.target.value.trim(); if(!t) return;
    v.title=t; saveState(); render();
  });
  var iconInp=body.querySelector('.set-icon-input');
  iconInp.addEventListener('change', function(e){
    var t=e.target.value.trim()||'📆';
    v.icon=t; saveState(); render();
  });
  var sw=body.querySelector('#setAccentSwatches');
  ACCENT_COLORS.forEach(function(c){
    var b=document.createElement('button');
    b.className='swatch'+(c===state.accent?' active':'');
    b.style.background=c;
    b.addEventListener('click', function(){
      state.accent=c; saveState(); updateAccent();
      Array.prototype.forEach.call(sw.children, function(x){ x.classList.remove('active'); });
      b.classList.add('active');
    });
    sw.appendChild(b);
  });

  body.querySelectorAll('.counter').forEach(function(counter){
    var kind=counter.dataset.kind;
    counter.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var op=b.dataset.op;
        var delta = op==='+' ? 1 : -1;
        if(kind==='cols'){
          var nc=Math.max(1, v.columnCount+delta);
          if(nc>v.cells.length) nc=v.cells.length;
          if(nc<1) nc=1;
          v.columnCount=nc;
          if(v.cells.length % v.columnCount) addCellsToFill(v);
          saveState(); render(); renderSettings();
        } else if(kind==='rows'){
          var curRows=Math.max(1, Math.ceil(v.cells.length/v.columnCount));
          var nr=Math.max(1, curRows+delta);
          var target=v.columnCount*nr;
          changeCellCount(v, target);
        } else {
          changeCellCount(v, v.cells.length+delta);
        }
      });
    });
  });

  body.querySelector('#openBindBtn').addEventListener('click', function(){
    closeM('mSettings'); setTimeout(openBind, 80);
  });

  body.querySelectorAll('[data-theme]').forEach(function(b){

          for(var i=0;i<7;i++) dv.cells.push(makeCell(DAYS[i], null));
          state.views=[dv];
        }
        state.currentViewId=state.views[0].id;
        saveState(); closeM('mSettings'); render();
        toast('Модуль удалён');
      });
  });
}

function addCellsToFill(v){
  var N=v.columnCount;
  var target=Math.ceil(v.cells.length/N)*N;
  while(v.cells.length<target) v.cells.push(makeCell('', null));
}

function changeCellCount(v, newCount){
  if(newCount<1) newCount=1;
  if(newCount===v.cells.length) return;
  if(newCount<v.cells.length){
    var removed=v.cells.slice(newCount);
    var withData=removed.filter(function(c){ return c.tasks.length>0 || c.name || c.date; });
    if(withData.length){
      confirmDialog('Уменьшить количество ячеек?',
        'Будет удалено '+removed.length+' ячеек, из них с данными: '+withData.length+'. Продолжить?',
        function(){
          pushUndo();
          v.cells=v.cells.slice(0,newCount);
          if(v.columnCount>v.cells.length) v.columnCount=Math.max(1, v.cells.length);
          saveState(); render(); renderSettings();
        });
      return;
    }
    pushUndo();
    v.cells=v.cells.slice(0,newCount);
    if(v.columnCount>v.cells.length) v.columnCount=Math.max(1, v.cells.length);
  } else {
    pushUndo();
    while(v.cells.length<newCount) v.cells.push(makeCell('', null));
  }
  saveState(); render(); renderSettings();
}

/* === Поиск === */
function renderSearch(root){
  var q=ui.searchQuery.toLowerCase();
  var words=q.split(/\s+/).filter(Boolean);
  var curId=state.currentViewId;
  var cur=[], other=[];
  state.views.forEach(function(v){
    v.cells.forEach(function(cell){
      var hay=(cell.name+' '+(cell.date?fmtBadge(cell.date):'')+' '+
        cell.tasks.map(function(t){return t.text;}).join(' ')).toLowerCase();
      var ok=words.every(function(w){ return hay.indexOf(w)>=0; });
      if(!ok) return;
      var matched=cell.tasks.filter(function(t){
        return words.every(function(w){ return t.text.toLowerCase().indexOf(w)>=0; });
      });
      var item={view:v, cell:cell, matched:matched.length?matched:cell.tasks};
      if(v.id===curId) cur.push(item);
      else other.push(item);
    });
  });

  if(cur.length){
    var t1=document.createElement('div');
    t1.className='results-section'; t1.textContent='В текущем модуле';
    root.appendChild(t1);
    cur.forEach(function(it){ root.appendChild(buildHit(it, false)); });
  }
  if(other.length){
    if(cur.length){
      var d=document.createElement('div');
      d.className='results-div'; root.appendChild(d);
    } else {
      var t2=document.createElement('div');
      t2.className='results-section'; t2.textContent='Найдено в других модулях';
      root.appendChild(t2);
    }
    other.forEach(function(it){ root.appendChild(buildHit(it, true)); });
  }
  if(!cur.length && !other.length){
    root.innerHTML='<p class="empty">Ничего не найдено</p>';
  }
}
function buildHit(item, otherView){
  var v=item.view, cell=item.cell;
  var btn=document.createElement('button');
  btn.className='search-hit';
  var dateStr = cell.date ? fmtBadge(cell.date)+' · ' : '';
  var nameStr = cell.name ? esc(cell.name) : 'Без названия';
  var prev = item.matched.length
    ? '☐ '+esc(item.matched[0].text)
    : 'Ячейка';
  var moduleLabel = otherView ? '<span class="hit-module">'+v.icon+' '+esc(v.title)+'</span>' : '';
  btn.innerHTML = '<div class="hit-meta">'+moduleLabel+'<b>'+dateStr+nameStr+'</b></div>'+
    '<div class="hit-body">'+prev+'</div>';
  btn.addEventListener('click', function(){
    if(otherView){
      state.currentViewId=v.id; saveState();
      ui.searchQuery=''; $('#searchInput').value='';
      $('#searchOverlay').classList.remove('open');
      render();
      setTimeout(function(){
        var el=document.querySelector('[data-cell="'+cell.id+'"]');
        if(el){
          el.scrollIntoView({behavior:'smooth', block:'center'});
          el.classList.add('flash');
          setTimeout(function(){ el.classList.remove('flash'); }, 2000);
        }
      }, 300);
    } else {
      openTasksModal(cell);
    }
  });
  return btn;
}
